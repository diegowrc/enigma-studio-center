<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E5E1D5" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#0F0D0B" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ENIGMA"><meta name="format-detection" content="telephone=no">
<title>ENIGMA TRACKING</title>
<script>try{var t=localStorage.getItem("enigma_theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>

:root{
  --bg:#E5E1D5; --panel:#FAF8F3; --ink:#191512; --mute:#625C52; --line:#CBC5B4; --soft:#EEEBE0;
  --hdr-bg:#191512; --hdr-ink:#E5E1D5; --hdr-mute:#A39D90; --hdr-line:#3A342D; --hdr-accent:#8FA6FF;
  --brand-a:#00A86B; --brand-b:#D4AF37;
  --accent:#2347D9; --accent-ink:#FFFFFF;
  --A:#0E8A4B; --P:#BF7400; --E:#2347D9; --D:#C0322B; --Q:#7C8491;
  --good:#0E8A4B; --bad:#C0322B;
  --font:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --label:"Helvetica Neue",Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){ --bg:#0F0D0B; --panel:#1C1814; --ink:#ECE8DD; --mute:#A39D90; --line:#332D26; --soft:#25201B;
    --accent:#6C8CFF; --accent-ink:#0B0E14; --A:#3FCB86; --P:#F0A53A; --E:#6C8CFF; --D:#FF7A70; --Q:#8B93A0; --good:#3FCB86; --bad:#FF7A70; }}
:root[data-theme=dark]{ --bg:#0F0D0B; --panel:#1C1814; --ink:#ECE8DD; --mute:#A39D90; --line:#332D26; --soft:#25201B;
    --accent:#6C8CFF; --accent-ink:#0B0E14; --A:#3FCB86; --P:#F0A53A; --E:#6C8CFF; --D:#FF7A70; --Q:#8B93A0; --good:#3FCB86; --bad:#FF7A70; }
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--font);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--line)}
.top-in{max-width:1180px;margin:0 auto;padding:0 20px}
.top-row{display:flex;justify-content:space-between;align-items:center;gap:16px 24px;padding:16px 0 4px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:.55em;line-height:1;user-select:none;color:var(--ink)}
.brand-main,.brand-sub{font-family:"Montserrat","Helvetica Neue",Helvetica,Arial,sans-serif;text-transform:uppercase}
.brand-main{font-weight:800;font-size:32px;letter-spacing:.05em}
.brand-sub{font-weight:300;font-size:16px;letter-spacing:.42em}
.tabs{display:flex;gap:30px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:10px 0 11px;margin-bottom:-1px;cursor:pointer;color:var(--mute);font-weight:600;white-space:nowrap;border-radius:0}
.tab:hover{color:var(--ink);background:none}
.tab[aria-selected=true]{color:var(--ink);background:none;border-bottom-color:var(--accent);box-shadow:none}
.filebar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.filebar .btn{padding:6px 12px;font-size:14px}
@media(max-width:520px){.brand-main{font-size:26px}.brand-sub{font-size:13px}.tabs{gap:22px}}
.modal{position:fixed;inset:0;background:rgba(10,12,16,.45);display:grid;place-items:center;z-index:70;padding:20px}
.modal-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:22px;width:100%;max-width:360px}
.mErr{color:var(--bad);font-size:13px;min-height:18px;margin:6px 0}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.chip{font-size:13px;color:var(--mute);padding:4px 10px;border:1px solid var(--line);border-radius:999px;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip.warn{color:var(--P);border-color:var(--P);font-weight:600}
.btn{border:1px solid var(--line);background:var(--panel);padding:7px 13px;border-radius:8px;cursor:pointer;font-weight:600}
.btn:hover{background:var(--soft)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.small{padding:4px 9px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.ghost{border-color:transparent;background:none;color:var(--mute)}
main{max-width:1180px;margin:0 auto;padding:22px 20px 80px}
h1,h2,h3{margin:0;letter-spacing:-.01em}
h2{font-size:18px}
h3{font-size:15px}
.muted{color:var(--mute)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px 20px}
.grid>.panel{margin-top:0!important}
.panel+.panel,.grid+.panel,.panel+.grid,.grid+.grid,.stats+*{margin-top:16px}
.panel-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:3fr 2fr}
.g2e{grid-template-columns:1fr 1fr}
@media(max-width:860px){.g2,.g2e{grid-template-columns:1fr}}
/* stats */
.stats{display:grid;grid-template-columns:repeat(6,1fr);background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.stat{padding:14px 18px;border-left:1px solid var(--line)}
.stat:first-child{border-left:0}
.stat b{display:block;font-size:24px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--mute)}
.stat small{display:block;font-size:12px;color:var(--mute)}
@media(max-width:900px){.stats{grid-template-columns:repeat(3,1fr)}.stat:nth-child(4){border-left:0}.stat:nth-child(n+4){border-top:1px solid var(--line)}}
@media(max-width:520px){.stats{grid-template-columns:repeat(2,1fr)}.stat{border-left:0!important}.stat:nth-child(even){border-left:1px solid var(--line)!important}.stat:nth-child(n+3){border-top:1px solid var(--line)}}
.pos{color:var(--good)} .neg{color:var(--bad)}
/* inventory */
.inv{padding:12px 0;border-top:1px solid var(--line)}
.inv:first-of-type{border-top:0;padding-top:0}
.inv-top{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.sw{width:16px;height:16px;border-radius:50%;border:1px solid rgba(128,128,128,.5);flex:none}
.bar{height:12px;border-radius:6px;background:var(--soft);border:1px solid var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent)}
.bar>i.low{background:var(--bad)}
.inv-n{display:flex;justify-content:space-between;gap:12px;margin-top:7px;font-size:13px;color:var(--mute);flex-wrap:wrap}
.inv-n b{color:var(--ink)}
/* tables */
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-weight:600;color:var(--mute);font-size:13px;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums}
.tbl th.num{text-align:right}
.tbl tbody tr.click{cursor:pointer}
.tbl tbody tr.click:hover{background:var(--soft)}
.scroll{overflow-x:auto}
.badge{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:6px;font:800 14px var(--label);color:#fff}
.L-A{background:var(--A)} .L-P{background:var(--P)} .L-E{background:var(--E)} .L-D{background:var(--D)} .L-Q{background:var(--Q)}
.tag{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--soft);border:1px solid var(--line);white-space:nowrap}
/* charts */
svg.chart{width:100%;height:auto;display:block}
svg.chart text{fill:var(--mute);font:12px var(--font)}
svg.chart .grid{stroke:var(--line);stroke-width:1}
svg.chart .zero{stroke:var(--mute);stroke-width:1.2}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--mute);margin-bottom:6px}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle}
#tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--bg);padding:6px 9px;border-radius:6px;font-size:12.5px;z-index:50;display:none;max-width:260px;line-height:1.35}
/* forms */
label.f{display:block;font-size:13px;font-weight:600;color:var(--mute);margin-bottom:4px}
.in,select.in,textarea.in{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
.in:focus{border-color:var(--accent)}
.row{display:grid;gap:12px;margin-bottom:12px}
.r2{grid-template-columns:1fr 1fr}.r3{grid-template-columns:repeat(3,1fr)}.r4{grid-template-columns:repeat(4,1fr)}
@media(max-width:720px){.r2,.r3,.r4{grid-template-columns:1fr 1fr}}
@media(max-width:480px){.r2,.r3,.r4{grid-template-columns:1fr}}
.art{border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:14px;background:var(--soft)}
.art .in{background:var(--panel)}
.art-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.prod{border:2px solid var(--line);border-radius:12px;padding:16px;margin-bottom:18px}
.prod-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.prod-h h3{margin:0}.pname{padding:9px 0}
.prev-p{border-top:1px solid var(--line);margin-top:4px;padding-top:10px}
.prev{font-size:13px;color:var(--mute);display:flex;gap:16px;flex-wrap:wrap;padding-top:4px}
.prev b{color:var(--ink);font-variant-numeric:tabular-nums}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.hint{font-size:13px;color:var(--mute)}
.empty{text-align:center;padding:64px 20px}
.empty h2{font-size:22px;margin-bottom:8px}
.empty p{max-width:520px;margin:0 auto 18px;color:var(--mute)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:60;display:none;max-width:90vw}
/* nutrition-style label */
.labelwrap{display:grid;grid-template-columns:minmax(300px,420px) 1fr;gap:28px;align-items:start}
@media(max-width:820px){.labelwrap{grid-template-columns:1fr}}
.nf{background:#fff;color:#000;border:2px solid #000;padding:10px 12px 12px;font-family:var(--label);width:100%;max-width:420px}
.nf *{color:#000}
.nf-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.nf h2{font:900 30px/1 var(--label);letter-spacing:-.02em;margin:0}
.nf-title{display:flex;align-items:baseline;flex-wrap:wrap;gap:3px 9px;text-transform:uppercase}
.nf-title .t1{font:800 34px/1 "Montserrat",var(--label);letter-spacing:.03em}
.nf-title .t2{font:400 17px/1 "Montserrat",var(--label);letter-spacing:.24em}
.nf-id{font:700 15px var(--label);margin-top:6px}
.nf-sm{font-size:13px;line-height:1.3}
.nf-letter{flex:none;width:104px;height:104px;border:3px solid #000;display:grid;place-items:center;font:900 84px/1 var(--label);color:#fff!important;margin-top:-2px}
.nf-letter.L-A{background:#0E8A4B}.nf-letter.L-P{background:#E39A00}.nf-letter.L-E{background:#2347D9}.nf-letter.L-D{background:#C0322B}.nf-letter.L-Q{background:#8A919C}
.nf-letter-cap{font:700 11px var(--label);text-align:center;margin-top:3px}
.b8{height:8px;background:#000;margin:8px 0 6px}
.b4{height:4px;background:#000;margin:5px 0}
.b1{height:1px;background:#000;margin:3px 0}
.nf-row{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:2px 0;border-top:1px solid #000}
.nf-row:first-of-type{border-top:0}
.nf-row.ind{padding-left:16px;font-size:13.5px}
.nf-row b{font-weight:800}
.nf-row .r{text-align:right;white-space:nowrap}
.nf-big{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.nf-big .t{font:800 14px var(--label)}
.nf-big .v{font:900 40px/1 var(--label);letter-spacing:-.02em}
.nf-cols{text-align:right;font:800 12px var(--label);padding:2px 0}
.nf-foot{font-size:12px;line-height:1.35;margin-top:6px}
.legendbox{display:grid;gap:8px}
.legendbox div{display:flex;gap:10px;align-items:center}
@media print{
  body{background:#fff}
  .pr-hide,.top,#toast,#tip,#saveFab,#modal,#safariBar{display:none!important}
  main{padding:0;max-width:none}
  .nf{max-width:420px;margin:0}
  .nf-letter{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
#view-label{margin-top:16px}
.hidden{display:none!important}
.pending-list .item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.pending-list .item:first-child{border-top:0}
@media (prefers-reduced-motion:no-preference){.bar>i{transition:width .4s}}
/* ===== iPhone / pantallas táctiles ===== */
html{-webkit-text-size-adjust:100%}
.btn,.tab,.in{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.ti{display:none}
#saveFab{display:none}
@media(max-width:700px){
  body{font-size:16px}
  .top{position:static;padding-top:env(safe-area-inset-top)}
  .top-in{padding:0 max(14px,env(safe-area-inset-left))}
  .top-row{padding:12px 0 12px;gap:10px}
  .brand-main{font-size:27px}.brand-sub{font-size:13.5px}
  .filebar{width:100%;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
  .filebar::-webkit-scrollbar{display:none}
  .filebar>*{flex:none}
  .filebar .btn{min-height:42px;padding:8px 14px;font-size:15px}
  .chip{display:none}.chip.warn{display:inline-block}
  main{padding:14px max(14px,env(safe-area-inset-left)) calc(104px + env(safe-area-inset-bottom))}
  .panel{padding:14px}
  .empty{padding:44px 14px}
  .tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;justify-content:space-around;gap:0;overflow:visible;
    background:var(--panel);border-top:1px solid var(--line);padding:6px 2px calc(6px + env(safe-area-inset-bottom))}
  @supports ((-webkit-backdrop-filter:blur(1px)) or (backdrop-filter:blur(1px))){
    .tabs{background:color-mix(in srgb,var(--panel) 88%,transparent);-webkit-backdrop-filter:saturate(180%) blur(18px);backdrop-filter:saturate(180%) blur(18px)}}
  .tab{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;margin:0;border:0;min-height:50px;font-size:10px;letter-spacing:-.2px;font-weight:600}
  .tab span{max-width:100%;overflow:hidden;text-overflow:ellipsis}
  @media(max-width:400px){.tab{font-size:9px;letter-spacing:-.3px}}
  .tab[aria-selected=true]{border:0;color:var(--accent)}
  .ti{display:block;width:25px;height:25px}
  .xl{display:none}
  .in,select.in,textarea.in{font-size:16px;min-height:44px}
  .btn{min-height:44px;font-size:15px}
  .btn.small{min-height:38px;padding:6px 12px;font-size:14px}
  .r2,.r3,.r4{grid-template-columns:1fr}.art .r3,.art .r4{grid-template-columns:1fr 1fr}
  .filebar #fbSave,.filebar #fbDl{display:none}
  .tbl td:has(.btn){justify-content:flex-start;gap:10px}
  .stat{padding:12px 14px}.stat b{font-size:22px}
  .labelwrap{gap:18px}.nf{max-width:100%}
  .actions .btn{flex:1 1 auto}
  .tbl,.tbl tbody,.tbl tr,.tbl td{display:block;width:100%}
  .tbl thead{display:none}
  .tbl tbody tr{border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:10px;background:var(--panel)}
  .tbl tbody tr:last-child{margin-bottom:0}
  .tbl td,.tbl tr:last-child td{border:0;padding:4px 0;display:flex;justify-content:space-between;align-items:center;gap:14px;text-align:right}
  .tbl td::before{content:attr(data-label);color:var(--mute);font-size:13px;text-align:left;flex:none}
  .tbl td:first-child{font-size:17px;padding-bottom:6px;margin-bottom:4px;border-bottom:1px solid var(--line)}
  .tbl td:first-child::before{content:none}
  .tbl td:empty{display:none}
  .tbl tbody tr.click:active{background:var(--soft)}
  .scroll{overflow:visible}
  #saveFab.show{display:block;position:fixed;right:14px;bottom:calc(80px + env(safe-area-inset-bottom));z-index:40;border-radius:999px;padding:12px 22px;box-shadow:0 8px 24px rgba(0,0,0,.28)}
  #toast{bottom:calc(140px + env(safe-area-inset-bottom))}
  .modal{align-items:end;padding:0}
  .modal-card{max-width:none;border-radius:18px 18px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom))}
}
/* ===== estado del lote ===== */
.st-pen{--c:#7C8491}.st-pro{--c:#D9A400}.st-fin{--c:var(--A)}.st-sin{--c:var(--E)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .st-pen{--c:#8B93A0}:root:not([data-theme=light]) .st-pro{--c:#F0C23A}}
:root[data-theme=dark] .st-pen{--c:#8B93A0}:root[data-theme=dark] .st-pro{--c:#F0C23A}
select.stsel{width:auto;min-width:150px;padding:5px 28px 5px 10px;border:1px solid var(--line);border-left:8px solid var(--c);background:color-mix(in srgb,var(--c) 14%,var(--panel));font-weight:600;border-radius:8px;cursor:pointer}
.fchips{display:flex;gap:8px;flex-wrap:wrap}
.fchip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 12px;font-weight:600;font-size:13.5px;cursor:pointer;white-space:nowrap}
.fchip i{width:10px;height:10px;border-radius:50%;background:var(--c,var(--mute));flex:none}
.fchip small{color:var(--mute);font-weight:600;font-size:12.5px}
.fchip[aria-pressed=true]{border-color:var(--ink);background:var(--soft);box-shadow:inset 0 0 0 1px var(--ink)}
.panel-h.stack{align-items:center}
@media(max-width:700px){
  .panel-h.stack{display:block}
  .panel-h.stack h2{margin-bottom:10px}
  .fchips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -14px;padding:2px 14px 6px}
  .fchips::-webkit-scrollbar{display:none}
  .fchip{flex:none;min-height:40px;font-size:14.5px;padding:6px 14px}
  select.stsel{min-width:160px;max-width:100%}
}
/* ===== aviso: abierto dentro de WhatsApp / navegador integrado ===== */
#safariBar{display:none;position:sticky;top:0;z-index:80;background:#FFF4D6;color:#3a2a00;border-bottom:2px solid #E39A00;padding:max(12px,env(safe-area-inset-top)) 16px 12px}
#safariBar.show{display:block}
#safariBar b{display:block;font-size:15px;margin-bottom:4px}
#safariBar p{margin:0 0 10px;font-size:14px;line-height:1.4}
#safariBar ol{margin:0 0 10px;padding-left:20px;font-size:14px;line-height:1.5}
#safariBar .btn{color:#15181E;background:#fff;border-color:#c9a24a}
#safariBar .btn.primary{background:#2347D9;color:#fff;border-color:#2347D9}
#safariBar .row2{display:flex;gap:8px;flex-wrap:wrap}

/* ===== paleta ENIGMA: piedra antigua #E5E1D5 + café obsidiana #191512 ===== */
html{background:var(--bg)}
.brand-main{color:var(--brand-a)}.brand-sub{color:var(--brand-b)}
@media(min-width:701px){
  .top{background:var(--hdr-bg);border-bottom:1px solid var(--hdr-line)}
  .top .brand{color:var(--hdr-ink)}
  .top .tab{color:var(--hdr-mute)}
  .top .tab:hover{color:var(--hdr-ink)}
  .top .tab[aria-selected=true]{color:var(--hdr-ink);border-bottom-color:var(--hdr-accent)}
  .top .btn{background:#26211C;color:var(--hdr-ink);border-color:var(--hdr-line)}
  .top .btn:hover{background:#322B25}
  .top .btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
  .top .btn.ghost{background:none;border-color:transparent;color:var(--hdr-mute)}
  .top .chip{color:var(--hdr-mute);border-color:var(--hdr-line)}
  .top .chip.warn{color:#F0A53A;border-color:#F0A53A}
}
@media(max-width:700px){
  .top{background:var(--bg);border-bottom:0}

@media (prefers-reduced-motion:no-preference){

  @keyframes pop{0%{transform:scale(.5) rotate(-10deg);opacity:0}60%{transform:scale(1.14) rotate(4deg);opacity:1}100%{transform:none;opacity:1}}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
  .crown:not(.sm){animation:float 3.4s ease-in-out infinite}
  .crown.draw{animation:pop .7s .1s both,float 3.4s .8s ease-in-out infinite}
  @keyframes shine{0%{transform:translateX(-120%)}55%,100%{transform:translateX(120%)}}
  .star::after{animation:shine 6s ease-in-out infinite}
  @keyframes grow{from{width:0}}
  .rkb i.draw{animation:grow .9s .2s cubic-bezier(.3,.7,.2,1) both}
  @keyframes growx{from{transform:scaleX(0)}}
  .sbar i.draw{transform-origin:left;animation:growx .8s cubic-bezier(.3,.7,.2,1) both}
}

<script>
"use strict";
const EST=["Pendiente","Listo","Entregado"],K={"Pendiente":"pen","Listo":"sin","Entregado":"fin","Pagado":"fin","Sin pagar":"bad"};
const $=s=>document.querySelector(s),F=id=>document.getElementById(id);
const nf=(n,d=0)=>Number(n||0).toLocaleString(undefined,{minimumFractionDigits:d,maximumFractionDigits:d}),money=n=>"$"+nf(n,2);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const norm=s=>String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().trim();
const XM="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet";
let S={orders:[],prices:{},tab:"dash",fs:new Set(),fp:new Set(),ps:new Set(),pOpen:false,q:"",edit:null,fq:false,sel:{cli:new Set(),prod:new Set()},merge:null,edC:false,edP:false,
  handle:null,fileName:"",buf:null,perm:false,dirty:0,mod:null,saving:false},tt,saveT;
function toast(m,ms=2800){const t=$("#toast");t.textContent=m;t.style.display="block";clearTimeout(tt);tt=setTimeout(()=>t.style.display="none",ms)}

/* ---------- códigos y precios ---------- */
const pfx=p=>{const base=norm(p).replace(/[^a-z0-9 ]/g,"").split(" ")[0].toUpperCase()||"PED";let n=3,c;
  const used=new Set(S.orders.filter(o=>o.p!==p&&o.cod).map(o=>o.cod.split("-")[0]));
  do{c=base.slice(0,n).padEnd(3,"X");n++}while(used.has(c)&&n<=base.length+1);return S.orders.find(o=>o.p===p&&o.cod)?.cod.split("-")[0]||c};
function nextCod(p){const x=pfx(p);const m=Math.max(0,...S.orders.filter(o=>o.cod&&o.cod.startsWith(x+"-")).map(o=>+o.cod.split("-")[1]||0));return x+"-"+String(m+1).padStart(3,"0")}
const pkey=(p,t)=>norm(p)+"|"+norm(t);
const listPrice=(p,t)=>S.prices[pkey(p,t)]?.v??S.prices[pkey(p,"")]?.v??null;
const qty=o=>Math.max(1,parseInt(o.q)||1);
const unit=o=>o.pr!==""&&o.pr!=null?+o.pr:(listPrice(o.p,o.t)??0);
const price=o=>unit(o)*qty(o);
const sum=a=>a.reduce((s,o)=>s+price(o),0);
const det=o=>[o.t,o.col,o.d].filter(Boolean).map(esc).join(" · ");
const addPrice=(p,t,v)=>{S.prices[pkey(p,t)]={p,t,v}};

/* ---------- el Excel es la única fuente de datos ---------- */
function fmtMod(){const d=S.mod?new Date(S.mod):null;return d?d.toLocaleString("es",{day:"numeric",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"}):""}
function changed(){S.mod=Date.now();S.dirty++;renderBar()}
const CAN_SHARE=(()=>{try{return !!(navigator.share&&navigator.canShare&&navigator.canShare({files:[new File([""],"a.xlsx",{type:XM})]}))}catch(e){return false}})();
function renderBar(){
  const fb=$("#filebar");let h="";
  if(!S.buf)h=`<button class="btn primary" id="fbOpen">Abrir Excel</button>`;
  else{
    h+=`<span class="chip" title="${esc(S.fileName)}">${esc(S.fileName)}</span>`;
    if(S.dirty)h+=`<span class="chip warn">${S.dirty} cambio${S.dirty>1?"s":""} sin guardar</span>`;
    const d=S.dirty?"":"disabled";
    if(S.handle)h+=`<button class="btn primary" id="bSave" ${d}>Guardar en el Excel</button>`;
    else if(CAN_SHARE)h+=`<button class="btn primary" id="bShare" ${d}>Guardar en Archivos</button>`;
    else h+=`<button class="btn primary" id="bCopy" ${d}>Descargar Excel actualizado</button>`;

function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}

  const g2=c.createLinearGradient(0,0,W,0);g2.addColorStop(0,"#2A4D8F");g2.addColorStop(.5,"#00A86B");g2.addColorStop(1,"#D4AF37");c.fillStyle=g2;c.fillRect(0,HD-4,W,4);
  c.font=`800 40px Montserrat,${FONT}`;c.fillStyle="#00A86B";c.fillText("ENIGMA",P,64);const w1=c.measureText("ENIGMA").width;

  c.fillStyle="#16305C";c.fillRect(P,TT,IW,TH);
  c.font=`700 14px ${FONT}`;c.fillStyle="#fff";
  let x=P;heads.forEach((h,i)=>{if(i===4){c.textAlign="center";c.fillText(h,x+cw[i]/2,TT+28);c.textAlign="left"}else c.fillText(h,x+10,TT+28);x+=cw[i]});
  let y=TT+TH;
  rows.forEach((r,k)=>{
    if(k%2){c.fillStyle="#F1EEE4";c.fillRect(P,y,IW,r.h)}
    c.fillStyle="#CBC5B4";c.fillRect(P,y,IW,1);
    const by=a=>y+(r.h-a*LH)/2+15;
    let x0=P;
    c.font="600 14px ui-monospace,Consolas,monospace";c.fillStyle="#625C52";c.fillText(r.o.cod,x0+10,y+r.h/2+5);x0+=cw[0];
    c.font=`700 16px ${FONT}`;c.fillStyle="#191512";r.c.forEach((t,j)=>c.fillText(t,x0+10,by(r.c.length)+j*LH));x0+=cw[1];
    c.font=`500 16px ${FONT}`;r.p.forEach((t,j)=>c.fillText(t,x0+10,by(r.p.length)+j*LH));x0+=cw[2];
    c.fillStyle="#625C52";r.d.forEach((t,j)=>c.fillText(t,x0+10,by(r.d.length)+j*LH));x0+=cw[3];
    c.font=`800 18px ${FONT}`;c.fillStyle="#191512";c.textAlign="center";c.fillText(String(qty(r.o)),x0+cw[4]/2,y+r.h/2+6);c.textAlign="left";x0+=cw[4];
    c.font=`700 13px ${FONT}`;const tw=c.measureText(r.o.e).width+26;
    rr(c,x0+10,y+(r.h-28)/2,tw,28,14);c.fillStyle=SC[r.o.e]||"#7C8491";c.fill();c.fillStyle="#fff";c.fillText(r.o.e,x0+23,y+r.h/2+5);
    y+=r.h});
  c.restore();
  c.font=`500 13px ${FONT}`;c.fillStyle="#625C52";c.textAlign="center";c.fillText("Generado con ENIGMA TRACKING",W/2,H-26);c.textAlign="left";
  const blob=await new Promise(res=>cv.toBlob(res,"image/png"));if(!blob)throw new Error("El navegador no pudo crear la imagen");
  return blob}
const imgName=()=>"pedidos_enigma_"+new Date().toLocaleDateString("sv")+".png";
function dlBlob(b){const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=imgName();document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);toast("Imagen descargada")}
async function imgAct(kind){
  if(!S.orders.some(match)){toast("No hay pedidos con este filtro.");return}
  try{
    if(kind==="copy"){
      if(!(navigator.clipboard&&window.ClipboardItem)){toast("Este navegador no deja copiar imágenes. Usa «Descargar imagen».",5000);return}
      await navigator.clipboard.write([new ClipboardItem({"image/png":buildImg()})]);
      toast("Imagen copiada. Pégala en WhatsApp o donde quieras.",4000)}
    else{
      const b=await buildImg();
      if(kind==="share"){
        try{await navigator.share({files:[new File([b],imgName(),{type:"image/png"})],title:"Pedidos pendientes"})}
        catch(e){if(e.name==="AbortError")return;if(e.name==="NotAllowedError")dlBlob(b);else throw e}}
      else dlBlob(b)}
  }catch(e){if(e&&e.name==="AbortError")return;console.error(e);toast("No se pudo crear la imagen: "+(e.message||e),5000)}}

/* ---------- tema claro / oscuro ---------- */
const isDark=()=>{const t=document.documentElement.getAttribute("data-theme");return t?t==="dark":matchMedia("(prefers-color-scheme:dark)").matches};
const ICSUN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const ICMOON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
const themeBtn=()=>{const d=isDark(),t=d?"Cambiar a modo claro":"Cambiar a modo oscuro";return `<button class="btn" id="bTheme" title="${t}" aria-label="${t}">${d?ICSUN:ICMOON}</button>`};
function syncMeta(){const t=document.documentElement.getAttribute("data-theme");document.querySelectorAll('meta[name=theme-color]').forEach(m=>{m.content=t?(t==="dark"?"#0F0D0B":"#E5E1D5"):(m.media&&m.media.includes("dark")?"#0F0D0B":"#E5E1D5")})}
function toggleTheme(){const n=isDark()?"light":"dark";document.documentElement.setAttribute("data-theme",n);try{localStorage.setItem("enigma_theme",n)}catch(e){}syncMeta();renderBar()}
syncMeta();

/* ---------- menú Otros ---------- */
function openOtros(){const can=!!(S.handle||CAN_SHARE);const c=F("oCopy");c.style.display=can?"":"none";c.disabled=!S.dirty;F("oHint").textContent=can&&!S.dirty?"Haz algún cambio para poder descargar una copia.":"";F("otrosM").classList.remove("hidden")}
const closeOtros=()=>F("otrosM").classList.add("hidden");
F("oNo").onclick=closeOtros;F("otrosM").addEventListener("click",e=>{if(e.target.id==="otrosM")closeOtros()});
F("oOpen").onclick=()=>{closeOtros();openExcel()};
F("oCopy").onclick=()=>{closeOtros();saveExcel("dl")};

/* ---------- inicio ---------- */
S.fx=true;
renderAll();
</script>
