<script>
"use strict";
/* ================= utilidades ================= */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num=v=>{const n=typeof v==="number"?v:parseFloat(String(v??"").replace(",","."));return isFinite(n)?n:null};
const nz=v=>num(v)||0;
const nf=(n,d=0)=>Number(n||0).toLocaleString(undefined,{minimumFractionDigits:d,maximumFractionDigits:d});
const money=n=>(n<0?"−$":"$")+Math.abs(n||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
const hm=min=>{min=Math.round(min||0);const h=Math.floor(min/60),m=min%60;return h?(m?`${h} h ${m} min`:`${h} h`):`${m} min`};
const todayISO=()=>{const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const shortDate=iso=>iso?new Date(iso+"T12:00:00").toLocaleDateString("es",{day:"numeric",month:"short"}):"—";
const norm=s=>String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().trim();
const clone=o=>JSON.parse(JSON.stringify(o));
let toastT;function toast(t,ms=3200){const e=$("#toast");e.textContent=t;e.style.display="block";clearTimeout(toastT);toastT=setTimeout(()=>e.style.display="none",ms)}
const SW={negro:"#1d1d1f",chocolate:"#5b3a29",blanco:"#f2f2f2",rojo:"#d32f2f",azul:"#1e5bd8",verde:"#2e9e5b",amarillo:"#f2c200",gris:"#8d949e",naranja:"#ef7d1a",rosa:"#ec6aa8",morado:"#7b4fc4",celeste:"#4cb7e8",beige:"#d9c3a0",transparente:"#cfe6ee",cafe:"#4a2f20",lila:"#b9a2d8",roble:"#b88a54",porcelana:"#f4efe6",cyan:"#4cb7e8"};
const swatch=c=>{const k=norm(c);for(const n in SW)if(k.includes(n))return SW[n];return "#9aa0aa"};

/* ================= base de datos local (IndexedDB) ================= */
const STORES=["settings","clients","products","models","fichas","orders","orderDetails","lots","lotDetails","lotMaterials","lotSupplies","lotEquipment","allocations","materials","supplies","movements","equipment","maintenance"];
const D={},SEQ={};STORES.forEach(s=>{D[s]=[];SEQ[s]=0});
let DB=null,wq=Promise.resolve();
const DB_NAME="enigma_erp_v1";
function dbOpen(){return new Promise((res,rej)=>{const q=indexedDB.open(DB_NAME,1);q.onupgradeneeded=()=>{for(const s of STORES)if(!q.result.objectStoreNames.contains(s))q.result.createObjectStore(s,{keyPath:"id"})};q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}
const idbAll=s=>new Promise((res,rej)=>{const r=DB.transaction(s).objectStore(s).getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const idbDo=(s,fn)=>new Promise((res,rej)=>{const tx=DB.transaction(s,"readwrite");fn(tx.objectStore(s));tx.oncomplete=res;tx.onerror=()=>rej(tx.error)});
async function dbLoad(){for(const s of STORES){D[s]=await idbAll(s);SEQ[s]=D[s].reduce((a,o)=>Math.max(a,o.id||0),0)}D.lots.forEach(l=>{if(l.type==="Normal")l.type="Simple"});delWhere("allocations",a=>{const ld=by("lotDetails",a.lotDetailId);return !ld||!by("lots",ld.lotId)})}
function persist(fn){wq=wq.then(fn).catch(e=>{console.error(e);toast("No se pudo guardar en el navegador")})}
function put(s,o){if(!o.id)o.id=++SEQ[s];else SEQ[s]=Math.max(SEQ[s],o.id);const i=D[s].findIndex(x=>x.id===o.id);if(i<0)D[s].push(o);else D[s][i]=o;const c=clone(o);persist(()=>idbDo(s,st=>st.put(c)));S.dirty=true;return o}
function del(s,id){D[s]=D[s].filter(x=>x.id!==id);persist(()=>idbDo(s,st=>st.delete(id)));S.dirty=true}

/* ================= ficha técnica: estructura y cálculo =================
   ficha.arts = [{desc, perProd, cols:[{label, materialId, pesoU, purga}], h, m, sups:[{supplyId, qty}], notes}]
   Todo se escribe POR PRODUCTO; al calcular se multiplica por la cantidad. */
const blankCol=()=>({label:"",materialId:"",pesoU:"",purga:0});
const blankArt=()=>({desc:"",perProd:1,cols:[blankCol()],h:0,m:"",sups:[],notes:""});
function fichaFor(productId,modelId){
  return (modelId&&D.fichas.find(f=>f.modelId===modelId))||D.fichas.find(f=>f.productId===productId&&!f.modelId)||null;
}
function specCalc(spec,qty){
  const mats={},sups={};let min=0,g=0,unres=0;
  for(const a of spec||[]){
    const n=nz(a.perProd)*qty;if(!(n>0))continue;
    min+=(nz(a.h)*60+nz(a.m))*qty;
    for(const c of a.cols){const w=nz(c.pesoU)*n+nz(c.purga)*qty;g+=w;if(c.materialId)mats[c.materialId]=(mats[c.materialId]||0)+w;else unres+=w}
    for(const s of a.sups||[])if(s.supplyId)sups[s.supplyId]=(sups[s.supplyId]||0)+nz(s.qty)*qty;
  }
  return{mats,sups,min,g,unres};
}
const matCostOf=mats=>Object.entries(mats).reduce((a,[id,g])=>a+g*nz(by("materials",+id)?.pricePerKg)/1000,0);
const supCostOf=sups=>Object.entries(sups).reduce((a,[id,q])=>a+q*nz(by("supplies",+id)?.price),0);
const defaultKw=()=>{const e=D.equipment.find(e=>e.status==="Activo"&&nz(e.kw)>0)||D.equipment.find(e=>nz(e.kw)>0);return e?nz(e.kw):0};
/* costo estimado de una ficha/spec para qty unidades (con kW del equipo por defecto) */
function specCost(spec,qty,kw){
  const c=specCalc(spec,qty),cm=matCostOf(c.mats),cs=supCostOf(c.sups),ce=c.min/60*(kw??defaultKw())*tariff();
  return{...c,costMat:cm,costSup:cs,costElec:ce,cost:cm+cs+ce};
}

/* ================= lotes: cálculo central ================= */
const LOT_STATES=["Pendiente","En proceso","Finalizado","Sin terminar","Cancelado"];
const LOT_TYPES=["Simple","Agrupado"];
const DESTINOS=["VENTA","HOGAR","TALLER","PRUEBA","USO PERSONAL"];

const countsAsMade=lot=>["En proceso","Finalizado","Sin terminar"].includes(lot.status);
const consumes=lot=>["En proceso","Finalizado","Sin terminar"].includes(lot.status);
const detOk=d=>nz(d.qtyOk);
function unitPrice(od){
  if(od.price!==""&&od.price!=null&&num(od.price)!=null)return num(od.price);
  const m=od.modelId?by("models",od.modelId):null;
  if(m&&nz(m.price)>0)return nz(m.price);
  return nz(by("products",od.productId)?.price);
}
function lotCalc(lot,src){
  const dets=src?src.dets:D.lotDetails.filter(d=>d.lotId===lot.id);
  const est={mats:{},sups:{},min:0,g:0,unres:0};
  const dEst=dets.map(d=>{const c=specCalc(d.spec,nz(d.qty));
    for(const [k,v] of Object.entries(c.mats))est.mats[k]=(est.mats[k]||0)+v;
    for(const [k,v] of Object.entries(c.sups))est.sups[k]=(est.sups[k]||0)+v;
    est.min+=c.min;est.g+=c.g;est.unres+=c.unres;
    return{d,c,estCost:matCostOf(c.mats)+supCostOf(c.sups)}});
  const mrows=src?src.mrows:D.lotMaterials.filter(r=>r.lotId===lot.id),srows=src?src.srows:D.lotSupplies.filter(r=>r.lotId===lot.id),erows=src?src.erows:D.lotEquipment.filter(r=>r.lotId===lot.id);
  const mKeys=[...new Set([...Object.keys(est.mats),...mrows.map(r=>String(r.materialId))])];
  const mats=mKeys.map(k=>{const id=+k,r=mrows.find(x=>x.materialId===id),e=est.mats[k]||0,hasReal=r&&r.gramsReal!=null&&r.gramsReal!=="",real=hasReal?nz(r.gramsReal):e;
    const price=nz(by("materials",id)?.pricePerKg);return{id,est:e,real,hasReal,waste:nz(r?.gramsWaste),price,costEst:e*price/1000,cost:real*price/1000}});
  const sKeys=[...new Set([...Object.keys(est.sups),...srows.map(r=>String(r.supplyId))])];
  const sups=sKeys.map(k=>{const id=+k,r=srows.find(x=>x.supplyId===id),e=est.sups[k]||0,hasReal=r&&r.qtyReal!=null&&r.qtyReal!=="",real=hasReal?nz(r.qtyReal):e;
    const price=nz(by("supplies",id)?.price);return{id,est:e,real,hasReal,price,costEst:e*price,cost:real*price}});
  /* equipos: si no hay filas, el tiempo estimado se atribuye al primer equipo activo */
  let eq=erows.map(r=>{const hasReal=r.minutes!=null&&r.minutes!=="";return{id:r.equipmentId,real:hasReal?nz(r.minutes):null,hasReal,kw:nz(by("equipment",r.equipmentId)?.kw)}});
  if(!eq.length){const e0=D.equipment.find(e=>e.status==="Activo")||D.equipment[0];if(e0)eq=[{id:e0.id,real:null,hasReal:false,kw:nz(e0.kw)}]}
  const realKnown=eq.reduce((a,e)=>a+(e.hasReal?e.real:0),0),noReal=eq.filter(e=>!e.hasReal);
  eq.forEach(e=>{e.min=e.hasReal?e.real:(noReal.length?Math.max(0,(est.min-realKnown))/noReal.length:0)});
  const min=eq.reduce((a,e)=>a+e.min,0),kwh=eq.reduce((a,e)=>a+e.kw*e.min/60,0);
  const costMat=mats.reduce((a,m)=>a+m.cost,0),costSup=sups.reduce((a,s)=>a+s.cost,0),elec=kwh*tariff(),extra=nz(lot.extraCost);
  const cost=costMat+costSup+elec+extra;
  const costEst=mats.reduce((a,m)=>a+m.costEst,0)+sups.reduce((a,s)=>a+s.costEst,0)+(est.min/60)*(eq.length?eq.reduce((a,e)=>a+e.kw,0)/eq.length:defaultKw())*tariff();
  /* reparto del costo entre los productos del lote:
     - los INSUMOS son de cada producto: cada uno carga con los que lleva su propia ficha (los que no están en ninguna ficha se reparten como lo compartido)
     - lo COMPARTIDO (filamento, luz, otros costos) se reparte por costo estimado de filamento (si no hay, por gramos; si no, por cantidad) */
  let wf=x=>matCostOf(x.c.mats),wsum=dEst.reduce((a,x)=>a+wf(x),0);if(!(wsum>0)){wf=x=>x.c.g;wsum=dEst.reduce((a,x)=>a+wf(x),0)}
  const qsum=dets.reduce((a,d)=>a+Math.max(1,nz(d.qty)),0),costShared=cost-costSup;
  const dd=dEst.map(({d,c,estCost})=>{const sh=wsum>0?wf({c})/wsum:Math.max(1,nz(d.qty))/(qsum||1);
    const supC=sups.reduce((a,s)=>{const e=est.sups[s.id]||0,mine=c.sups[s.id]||0;return a+s.cost*(e>0?mine/e:sh)},0);
    const dcost=costShared*sh+supC,share=cost>0?dcost/cost:sh;
    const made=countsAsMade(lot)?detOk(d):0,den=Math.max(1,detOk(d)||nz(d.qty));
    const als=(src?src.allocs:D.allocations).filter(a=>a.lotDetailId===d.id).sort((a,b)=>a.id-b.id);let avail=made;
    const al=als.map(a=>{const m=Math.min(nz(a.qty),avail);avail-=m;const od=by("orderDetails",a.orderDetailId);return{a,od,made:m,price:od?unitPrice(od):0}});
    return{d,share,cost:dcost,sup:supC,unit:dcost/den,made,al,estMin:c.min,estG:c.g,estCost}});
  const revenue=dd.reduce((a,x)=>a+x.al.reduce((s,y)=>s+nz(y.a.qty)*y.price,0),0);
  const fail=dets.reduce((a,d)=>a+nz(d.qtyFail),0),okq=dets.reduce((a,d)=>a+detOk(d),0),plan=dets.reduce((a,d)=>a+nz(d.qty),0);
  return{lot,dets,dd,est,mats,sups,eq,min,kwh,g:mats.reduce((a,m)=>a+m.real,0),gEst:mats.reduce((a,m)=>a+m.est,0),
    costMat,costSup,elec,extra,cost,costEst,revenue,net:revenue-cost,fail,ok:okq,plan,letter:lotLetter(lot,dets)}
}
function lotLetter(lot,dets){
  if(lot.destino==="PRUEBA")return "P";
  const fail=dets.reduce((a,d)=>a+nz(d.qtyFail),0),ok=dets.reduce((a,d)=>a+detOk(d),0);
  if(fail>0&&ok===0&&lot.status!=="Pendiente")return "D";
  if(fail>0)return "D";
  if(lot.destino==="TALLER"||lot.destino==="HOGAR")return "E";
  if(!lot.destino)return "?";
  return "A";
}
const LETTER_T={A:"Terminado",E:"Taller / hogar",P:"Prueba",D:"Con piezas dañadas","?":"Sin destino"};

/* ================= pedidos: avance y estado ================= */
function odLinks(d){const L=[];for(const a of D.allocations.filter(a=>a.orderDetailId===d.id)){const ld=by("lotDetails",a.lotDetailId),lot=ld&&by("lots",ld.lotId);if(!lot)continue;const x=L.find(y=>y.id===lot.id);x?x.qty+=nz(a.qty):L.push({id:lot.id,code:lot.code,status:lot.status,qty:nz(a.qty)})}return{lots:L,pre:nz(d.preMade)}}
const lotTag=l=>`<span class="tag ${ST_CLASS[l.status]||""}" data-act="goLot" data-id="${l.id}" style="cursor:pointer" title="Abrir ${esc(l.code)}">${esc(l.code)} · ${l.qty} u. · ${esc(l.status)}</span>`;
function odProgress(od){
  const als=D.allocations.filter(a=>a.orderDetailId===od.id);
  let assigned=0,made=0;
  for(const a of als){const ld=by("lotDetails",a.lotDetailId),lot=ld&&by("lots",ld.lotId);if(!ld||!lot)continue;assigned+=nz(a.qty);
    if(!countsAsMade(lot))continue;
    /* cantidad hecha asignada a esta orden = reparto FIFO de lo fabricado entre las asignaciones del detalle de lote */
    let avail=detOk(ld);for(const x of D.allocations.filter(z=>z.lotDetailId===ld.id).sort((p,q)=>p.id-q.id)){const m=Math.min(nz(x.qty),avail);avail-=m;if(x.id===a.id){made+=m;break}}}
  const delivered=nz(od.delivered),qty=nz(od.qty);
  /* preMade: unidades que ya estaban listas antes de usar el sistema (sin lote registrado) */
  made+=nz(od.preMade);
  return{qty,assigned,made:Math.min(made,qty),delivered,pending:Math.max(0,qty-assigned-nz(od.preMade)),available:Math.max(0,Math.min(made,qty)-delivered)};
}
const orderSupCost=d=>(d.sups||[]).reduce((a,s)=>a+nz(s.qty)*nz(d.qty)*nz(by("supplies",+s.supplyId)?.price),0);
/* los insumos del pedido (ej. argolla) descuentan inventario y se cobran al pedido, no al lote */
function syncOrderMovements(o){
  if(!o)return;delWhere("movements",m=>m.auto&&m.orderId===o.id);if(!orderAllowsLot(o))return;
  const q={};for(const d of D.orderDetails.filter(d=>d.orderId===o.id))for(const s of d.sups||[]){const n=nz(s.qty)*nz(d.qty);if(n>0)q[s.supplyId]=(q[s.supplyId]||0)+n}
  for(const [id,n] of Object.entries(q))put("movements",{date:o.date||todayISO(),kind:"Salida",itemType:"Insumo",itemId:+id,qty:-n,reason:`Insumo del pedido ${o.code}`,auto:true,orderId:o.id})}
function orderCalc(o){
  const ds=D.orderDetails.filter(d=>d.orderId===o.id),P=ds.map(d=>odProgress(d));
  const total=ds.reduce((a,d)=>a+unitPrice(d)*nz(d.qty),0);
  let cost=0,costed=true;
  for(const d of ds){const als=D.allocations.filter(a=>a.orderDetailId===d.id);const asg=als.reduce((a,x)=>a+nz(x.qty),0);if(asg<nz(d.qty))costed=false;
    for(const a of als){const x=lotCalc(by("lots",by("lotDetails",a.lotDetailId)?.lotId)||{id:-1,status:"Pendiente"}).dd.find(y=>y.d.id===a.lotDetailId);if(x)cost+=x.unit*nz(a.qty)}}
  cost+=ds.reduce((a,d)=>a+orderSupCost(d),0);
  const qty=P.reduce((a,p)=>a+p.qty,0),made=P.reduce((a,p)=>a+p.made,0),del=P.reduce((a,p)=>a+p.delivered,0),asg=P.reduce((a,p)=>a+p.assigned,0);
  return{o,ds,P,total,cost,gain:total-cost,costed,qty,made,delivered:del,assigned:asg,hasLot:asg>0};
}
const ORD_STATES=["Sin entregar","Entregado","Cancelado - SP","Cancelado - P"]; /* o.status = estado de VENTA */
function deriveStatus(o){
  const ds=D.orderDetails.filter(d=>d.orderId===o.id),P=ds.map(d=>odProgress(d)),qty=P.reduce((a,p)=>a+p.qty,0),made=P.reduce((a,p)=>a+p.made,0),del=P.reduce((a,p)=>a+p.delivered,0);
  if(o.cancelled)return made>0?"Cancelado - P":"Cancelado - SP";
  if(qty>0&&del>=qty)return "Entregado";
  return "Sin entregar";
}
/* ---- tres estados independientes ----
   Producción: unidades SIN lote asignado (incluye las «hechas antes del sistema», aunque ya estén entregadas). 0 = Listo.
   Venta: Sin entregar / Entregado (o Cancelado). Pago: Pagado / Sin pagar. */

/* ================= inventario: descuento automático desde lotes =================
   Los movimientos con auto:true y ref=lote se recrean cada vez que el lote cambia. */
function syncLotMovements(lot){
  delWhere("movements",m=>m.auto&&m.lotId===lot.id);
  if(!consumes(lot))return;
  const c=lotCalc(lot);
  for(const m of c.mats)if(m.real>0)put("movements",{date:lot.date||todayISO(),kind:"Salida",itemType:"Material",itemId:m.id,qty:-m.real,reason:`Consumo de ${lot.code}${m.hasReal?"":" (estimado, falta real)"}`,auto:true,lotId:lot.id});
  for(const s of c.sups)if(s.real>0)put("movements",{date:lot.date||todayISO(),kind:"Salida",itemType:"Insumo",itemId:s.id,qty:-s.real,reason:`Consumo de ${lot.code}${s.hasReal?"":" (estimado, falta real)"}`,auto:true,lotId:lot.id});
}

/* tiempo acumulado por equipo: inicial + lotes */
function eqUsage(e){
  let min=0;const lots=new Set();
  for(const lot of D.lots){if(!consumes(lot))continue;const c=lotCalc(lot);for(const x of c.eq)if(x.id===e.id&&x.min>0){min+=x.min;lots.add(lot.id)}}
  return{min,lots:lots.size,total:min+nz(e.initialMin)};
}

  let inp;
  if(f.type==="select")inp=`<select class="in" id="${id}" ${f.req?"required":""}>${f.blank!==false?'<option value="">Seleccionar…</option>':""}${f.opts.map(o=>{const[ov,ol]=Array.isArray(o)?o:[o,o];return `<option value="${esc(ov)}" ${String(ov)===String(val)?"selected":""}>${esc(ol)}</option>`}).join("")}</select>`;
  else if(f.type==="textarea")inp=`<textarea class="in" id="${id}">${esc(val)}</textarea>`;
  else if(f.type==="checkbox")return `<div class="${f.full?"":""}"><label class="chk"><input type="checkbox" id="${id}" ${v?"checked":""}> ${esc(f.label)}</label></div>`;
  else inp=`<input class="in" id="${id}" type="${f.type||"text"}" value="${esc(val)}" ${f.type==="number"?`min="${f.min??0}" step="${f.step||"any"}" inputmode="decimal"`:""} ${f.req?"required":""}${ro} ${f.list?`list="${f.list}"`:""} ${f.ph?`placeholder="${esc(f.ph)}"`:""}>`;
  return `<div style="${f.full?"grid-column:1/-1":""}"><label class="f" for="${id}">${esc(f.label)}${f.req?" *":""}</label>${inp}${f.hint?`<div class="hint">${esc(f.hint)}</div>`:""}</div>`;

function odSave(){
  odRead();const od=S.od,err=$("#o-err");
  if(!od.clientName)return err.textContent="Escribe el cliente.",null;
  if(!od.details.length)return err.textContent="Añade al menos un artículo.",null;
  for(const [i,d] of od.details.entries()){if(!d.productId)return err.textContent=`Artículo ${i+1}: elige el producto.`,null;if(!(nz(d.qty)>0))return err.textContent=`Artículo ${i+1}: la cantidad debe ser mayor que 0.`,null;
    for(const s of d.sups||[])if(s.supplyId&&!(nz(s.qty)>0))return err.textContent=`Artículo ${i+1}: indica la cantidad del insumo.`,null;
    if(d.id){const p=odProgress({...d});if(nz(d.delivered)>p.made+1e-9)return err.textContent=`Artículo ${i+1}: no puedes entregar más de lo fabricado (${p.made}).`,null}}
  let cl=D.clients.find(c=>norm(c.name)===norm(od.clientName));if(!cl)cl=put("clients",{name:od.clientName,contact:"",phone:"",email:"",notes:""});
  const old=od.id?by("orders",od.id):null;
  const o=put("orders",{...(old||{}),id:od.id,code:od.code,clientId:cl.id,date:od.date,notes:od.notes,paid:od.paid,cancelled:od.cancelled,status:old?.status||"Pendiente"});
  const keep=new Set(od.details.filter(d=>d.id).map(d=>d.id));
  D.orderDetails.filter(d=>d.orderId===o.id&&!keep.has(d.id)).forEach(d=>{delWhere("allocations",a=>a.orderDetailId===d.id);del("orderDetails",d.id)});
  for(const d of od.details)put("orderDetails",{id:d.id,orderId:o.id,productId:+d.productId,modelId:d.modelId?+d.modelId:"",qty:nz(d.qty),price:d.price===""?"":num(d.price),desc:d.desc||"",color:d.color||"",delivered:nz(d.delivered),preMade:nz(d.preMade),sups:(d.sups||[]).filter(s=>s.supplyId).map(s=>({supplyId:+s.supplyId,qty:nz(s.qty)}))});
  refreshOrderStatus();syncOrderMovements(by("orders",o.id));return o;
}

function prodStats(){const m={};

  const k=S.rank==="paid"?"paid":"v";
  return Object.values(m).map(a=>({...a,n:a.orders.size,m:a[k]})).sort((a,b)=>b.m-a.m||b.u-a.u||a.p.localeCompare(b.p,"es"))}

    const s=`<circle class="seg ${fx?"draw":""}" cx="100" cy="100" r="${R}" stroke-dasharray="${len.toFixed(2)} ${(C-len).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}" style="stroke:${PAL[i]};animation-delay:${(i*.12).toFixed(2)}s"><title>${esc(a.p)}: ${money(a.m)}</title></circle>`;
    off+=f*C;return s}).join("");
  return `<svg class="donut" viewBox="0 0 200 200" role="img" aria-label="Ventas por producto"><circle cx="100" cy="100" r="${R}" fill="none" stroke="var(--soft)" stroke-width="26"/><g transform="rotate(-90 100 100)">${segs}</g><text class="dn-v" x="100" y="103">$${nf(tot,0)}</text><text class="dn-l" x="100" y="122">${S.rank==="paid"?"COBRADO":"VENTAS"}</text></svg>`}

function newLotFromOrder(oid,usePre){

    d.qty=nz(d.qty)+n;d.alloc[od.id]=n;if(usePre)clear.push(od.id)}
  if(!dr.dets.length){

    const why=D.orderDetails.filter(d=>d.orderId===oid).map(d=>{const k=odLinks(d);return `${itemName(d.productId,d.modelId)}: ${[...k.lots.map(l=>`${l.code} (${l.qty})`),k.pre?`${k.pre} previa(s) sin lote`:""].filter(Boolean).join(", ")||"sin vínculos"}`}).join(" · ");return toast("Este pedido ya está cubierto → "+why+". Ábrelo en Pedidos para revisar o quitar vínculos.",9000)}

/* convierte el borrador en la fuente que usa lotCalc, para ver costos en vivo sin guardar */

const lotKey=d=>(+d.productId||0)+"|"+(+d.modelId||0);

  else if(t.dataset.df&&["qty","qtyDone","qtyFail"].includes(t.dataset.df)){const d=dr.dets[lotDetIdx(t)];d[t.dataset.df]=t.value;const done=d.qtyDone===""?nz(d.qty):nz(d.qtyDone);const o=t.closest("[data-dk]").querySelector("[data-ok]");if(o)o.value=Math.max(0,done-nz(d.qtyFail));lotSum()}

/* ---------- guardar ---------- */
function lotValidate(dr){
  if(!dr.dets.length)return "Añade al menos un producto al lote.";
  for(const [i,d] of dr.dets.entries()){const t=`Producto ${i+1}`;
    if(!d.productId)return `${t}: elige el producto.`;if(!(nz(d.qty)>0))return `${t}: la cantidad planificada debe ser mayor que 0.`;
    const done=d.qtyDone===""?nz(d.qty):nz(d.qtyDone);if(nz(d.qtyFail)>done)return `${t}: las falladas no pueden superar las fabricadas.`;
    for(const [k,a] of d.spec.entries()){if(!(nz(a.perProd)>0))continue;if(!a.desc.trim())return `${t}, artículo ${k+1}: falta la descripción.`;
      for(const [j,c] of a.cols.entries()){if(!c.materialId)return `${t}, artículo ${k+1}, color ${j+1}: elige el filamento.`;if(!(nz(c.pesoU)>0))return `${t}, artículo ${k+1}, color ${j+1}: falta el peso.`}}
    const tot=Object.values(d.alloc).reduce((a,q)=>a+nz(q),0);if(tot>nz(d.qty))return `${t}: asignas ${tot} unidades a pedidos pero el lote solo planifica ${d.qty}.`;
    for(const [odId,q] of Object.entries(d.alloc)){if(!(nz(q)>0))continue;const od=by("orderDetails",+odId);if(!od)continue;
      const mine=new Set(dr.dets.filter(x=>x.id).map(x=>x.id)),others=D.allocations.filter(a=>a.orderDetailId===od.id&&!mine.has(a.lotDetailId)).reduce((s,a)=>s+nz(a.qty),0),inD=dr.dets.reduce((s,x)=>s+nz(x.alloc[odId]),0);
      if(others+inD>nz(od.qty))return `${t}: el pedido ${by("orders",od.orderId)?.code} solo necesita ${nz(od.qty)} unidades (ya hay ${others} asignadas en otros lotes).`}}
  return "";
}
ACT.lotSave=()=>{
  const dr=S.draft,err=lotValidate(dr);if(err){$("#lot-err").textContent=err;scrollTo({top:document.body.scrollHeight,behavior:"smooth"});return}
  dr.type=lotTypeOf(dr.dets);const old=dr.id?by("lots",dr.id):null;
  const lot=put("lots",{...(old||{}),id:dr.id||undefined,code:dr.code,date:dr.date||todayISO(),type:dr.type,status:dr.status,destino:dr.destino,description:dr.description.trim(),extraCost:dr.extraCost===""?0:num(dr.extraCost)||0});
  const keep=new Set(dr.dets.filter(d=>d.id).map(d=>d.id));
  D.lotDetails.filter(d=>d.lotId===lot.id&&!keep.has(d.id)).forEach(d=>del("lotDetails",d.id));
  delWhere("allocations",a=>{const ld=by("lotDetails",a.lotDetailId);return !ld||ld.lotId===lot.id});
  for(const d of dr.dets){const qty=nz(d.qty),done=d.qtyDone===""?qty:nz(d.qtyDone),fail=nz(d.qtyFail);
    const rec=put("lotDetails",{id:d.id||undefined,lotId:lot.id,productId:+d.productId,modelId:d.modelId?+d.modelId:"",qty,qtyDone:done,qtyFail:fail,qtyOk:Math.max(0,done-fail),spec:clone(d.spec)});
    d.id=rec.id;for(const [odId,q] of Object.entries(d.alloc))if(nz(q)>0)put("allocations",{lotDetailId:rec.id,orderDetailId:+odId,qty:nz(q)})}
  delWhere("lotMaterials",r=>r.lotId===lot.id);delWhere("lotSupplies",r=>r.lotId===lot.id);delWhere("lotEquipment",r=>r.lotId===lot.id);
  for(const [k,v] of Object.entries(dr.mats))if(v.gramsReal!==""||v.gramsWaste!==""||true)put("lotMaterials",{lotId:lot.id,materialId:+k,gramsReal:v.gramsReal===""?null:num(v.gramsReal),gramsWaste:v.gramsWaste===""?0:num(v.gramsWaste)});
  for(const [k,v] of Object.entries(dr.sups))put("lotSupplies",{lotId:lot.id,supplyId:+k,qtyReal:v.qtyReal===""?null:num(v.qtyReal)});
  for(const e of dr.eqs)if(e.equipmentId)put("lotEquipment",{lotId:lot.id,equipmentId:+e.equipmentId,minutes:e.minutes===""?null:num(e.minutes)});
  for(const id of dr.clearPre||[]){const od=by("orderDetails",id);if(od)put("orderDetails",{...od,preMade:0})}
  for(const [id,n] of Object.entries(dr.preUse||{})){const od=by("orderDetails",+id);if(od)put("orderDetails",{...od,preMade:Math.max(0,nz(od.preMade)-nz(n))})}
  syncLotMovements(lot);refreshOrderStatus();
  S.draft=null;toast(`${lot.code} guardado. Inventario y pedidos actualizados.`);renderAll();window.scrollTo(0,0);
};
ACT.lotDel=()=>{const id=S.draft.id;if(!confirm("¿Eliminar este lote? Se devuelve al inventario lo que había descontado y se quitan sus asignaciones a pedidos."))return;
  deleteLot(id);S.draft=null;toast("Lote eliminado");renderAll()};
function deleteLot(id){const dets=D.lotDetails.filter(d=>d.lotId===id);dets.forEach(d=>{delWhere("allocations",a=>a.lotDetailId===d.id);del("lotDetails",d.id)});
  delWhere("lotMaterials",r=>r.lotId===id);delWhere("lotSupplies",r=>r.lotId===id);delWhere("lotEquipment",r=>r.lotId===id);delWhere("movements",m=>m.auto&&m.lotId===id);del("lots",id);refreshOrderStatus()}

const blankAbLine=k=>{const c0=classes()[0];return{kind:k||"Material",id:"",qty:"",price:"",nw:{classification:c0?.code||"",line:c0?.line||"",brand:"",finish:"",kind:"PLA",color:"",colorCode:"",spoolG:1000,name:"",description:""}}};

function abCalc(l){
  const q=nz(l.qty),pr=l.price===""?null:nz(l.price);
  if(l.kind==="Material"){const m=l.id&&l.id!=="new"?by("materials",+l.id):null,sg=l.id==="new"?nz(l.nw.spoolG):nz(m?.spoolG||1000);return{g:q*sg,cost:pr==null?0:q*pr,sg}}
  return{g:0,cost:pr==null?0:q*pr,sg:0};
}
function abLineHtml(l,i){

    h+=`<div class="row r4"><div><label class="f">Clasificación *</label>${cs.length?`<select class="in" data-abn="classification">${cs.map(c=>`<option value="${esc(c.code)}" ${n.classification===c.code?"selected":""}>${esc(c.code)} · ${esc(c.line)}</option>`).join("")}</select>`:`<input class="in" data-abn="classification" value="${esc(n.classification)}" placeholder="P1">`}</div>

ACT.abSave=()=>{
  const ab=abDraft(),err=$("#ab-err"),fail=m=>{err.textContent=m};
  if(!ab.lines.some(l=>nz(l.qty)>0||l.id))return fail("Añade al menos una compra.");
  for(const [i,l] of ab.lines.entries()){const t=`Compra ${i+1}`,n=l.nw;
    if(!l.id)return fail(`${t}: elige ${l.kind==="Material"?"el filamento":"el insumo"} o crea uno nuevo.`);
    if(!(nz(l.qty)>0))return fail(`${t}: indica la cantidad comprada.`);
    if(l.id==="new"){
      if(!(nz(l.price)>0))return fail(`${t}: un artículo nuevo necesita su precio.`);
      if(l.kind==="Material"){if(!cleanCl(n.classification))return fail(`${t}: elige la clasificación.`);if(!n.kind.trim()||!n.color.trim())return fail(`${t}: faltan tipo de material y color.`);if(!(nz(n.spoolG)>0))return fail(`${t}: falta el peso de la bobina.`)}
      else if(!n.name.trim())return fail(`${t}: falta el nombre del insumo.`)}}
  const batch="AB-"+Date.now(),note=ab.notes.trim(),date=ab.date||todayISO();
  for(const l of ab.lines){const n=l.nw,q=nz(l.qty),hasP=l.price!=="";let it;
    if(l.kind==="Material"){
      if(l.id==="new"){const cl=cleanCl(n.classification);it=put("materials",{brand:n.brand.trim(),line:n.line.trim(),finish:n.finish.trim(),kind:n.kind.trim().toUpperCase(),color:n.color.trim(),colorCode:n.colorCode.trim(),spoolG:nz(n.spoolG),pricePerKg:nz(l.price)/(nz(n.spoolG)/1000),classification:cl,code:nextCode("materials",cl)})}
      else{it=by("materials",+l.id);if(hasP&&ab.upd){it.pricePerKg=nz(l.price)/(nz(it.spoolG||1000)/1000);put("materials",it)}}
      put("movements",{date,kind:"Entrada",itemType:"Material",itemId:it.id,qty:q*nz(it.spoolG||1000),reason:`Abastecimiento${note?" · "+note:""} (${q} bobina${q!==1?"s":""})`,batch,cost:hasP?q*nz(l.price):0});
    }else{
      if(l.id==="new")it=put("supplies",{code:nextCode("supplies"),name:n.name.trim(),description:n.description.trim(),price:nz(l.price)});
      else{it=by("supplies",+l.id);if(hasP&&ab.upd){it.price=nz(l.price);put("supplies",it)}}
      put("movements",{date,kind:"Entrada",itemType:"Insumo",itemId:it.id,qty:q,reason:`Abastecimiento${note?" · "+note:""} (${q} u.)`,batch,cost:hasP?q*nz(l.price):0});
    }}
  S.ab=null;toast("Abastecimiento registrado: el inventario ya se actualizó");renderAll();
};

/* ---- uso de un insumo: en qué lotes y pedidos está, y duplicados (pedido + lote que lo fabrica) ---- */
function supUsage(sid){
  const hasSup=spec=>(spec||[]).some(a=>nz(a.perProd)>0&&(a.sups||[]).some(x=>+x.supplyId===sid&&nz(x.qty)>0));
  const perOf=arr=>(arr||[]).filter(y=>+y.supplyId===sid).reduce((a,y)=>a+nz(y.qty),0);
  const lots=[];for(const lot of D.lots){const c=lotCalc(lot),r=c.sups.find(x=>x.id===sid);if(!r||!(r.est>0||r.real>0))continue;lots.push({lot,r,orders:lotOrders(c)})}
  const ords=[];for(const d of D.orderDetails){const per=perOf(d.sups),q=per*nz(d.qty);if(!(q>0))continue;const o=by("orders",d.orderId);if(o)ords.push({o,d,per,q,on:orderAllowsLot(o)})}
  const dups=[];
  for(const {o,d,per} of ords)for(const a of D.allocations.filter(a=>a.orderDetailId===d.id)){
    const ld=by("lotDetails",a.lotDetailId),lot=ld&&by("lots",ld.lotId);if(!lot||!hasSup(ld.spec))continue;
    const lp=specCalc(ld.spec,1).sups[sid]||0,n=nz(a.qty);
    dups.push({o,d,ld,lot,orderQ:per*n,lotQ:lp*n,dup:Math.min(per,lp)*n,live:orderAllowsLot(o)&&consumes(lot)})}
  const fichas=D.fichas.filter(f=>hasSup(f.arts));
  const out=-D.movements.filter(m=>m.itemType==="Insumo"&&m.itemId===sid&&m.auto&&m.qty<0).reduce((a,m)=>a+m.qty,0);
  return{lots,ords,dups,fichas,out,dupQ:dups.filter(x=>x.live).reduce((a,x)=>a+x.dup,0)};
}
function drawSupUse(sid){
  const s=by("supplies",sid);if(!s)return;const u=supUsage(sid),pr=nz(s.price);
  const sec=(t,h)=>`<h4 style="margin:16px 0 6px">${t}</h4>${h}`;
  const lotsT=table([{h:"Lote",f:r=>`<b>${esc(r.lot.code)}</b>`},{h:"Estado",f:r=>stTag(r.lot.status)},{h:"Pedidos que abastece",f:r=>r.orders.map(x=>`<span class="cod">${esc(x.o.code)}</span> ${esc(cliName(x.o.clientId))}`).join("<br>")||'<span class="muted">sin pedido</span>'},{h:"Estimado",num:1,f:r=>nf(r.r.est,0)+" u."},{h:"Real",num:1,f:r=>nf(r.r.real,0)+" u."},{h:"Costo",num:1,f:r=>money(r.r.cost)},{h:"Descuenta",f:r=>consumes(r.lot)?'<span class="tag g">sí</span>':'<span class="tag">no</span>'}],u.lots,{empty:"Ningún lote lo usa."});
  const ordT=table([{h:"Pedido",f:r=>`<span class="cod">${esc(r.o.code)}</span> ${esc(cliName(r.o.clientId))}`},{h:"Artículo",f:r=>`${nz(r.d.qty)} × ${esc(itemName(r.d.productId,r.d.modelId))}`},{h:"Por unidad",num:1,f:r=>nf(r.per,2)},{h:"Total",num:1,f:r=>nf(r.q,0)+" u."},{h:"Costo",num:1,f:r=>money(r.q*pr)},{h:"Descuenta",f:r=>r.on?'<span class="tag g">sí</span>':'<span class="tag">no (cancelado)</span>'}],u.ords,{empty:"Ningún pedido lo usa directamente."});
  const dupT=u.dups.length?`<div class="art" style="border-color:var(--warn)"><p class="hint" style="margin:0 0 10px"><b class="warn">Posible doble conteo:</b> el pedido lo lleva en su artículo <b>y</b> el lote que lo fabrica también lo lleva en su ficha. Se descuenta del inventario y se cobra dos veces. Elige de dónde quitarlo; el otro lugar se queda.</p>
   ${u.dups.map(x=>`<div style="padding:8px 0;border-top:1px solid var(--line)"><div><span class="cod">${esc(x.o.code)}</span> ${esc(cliName(x.o.clientId))} ⇄ <b>${esc(x.lot.code)}</b> <span class="muted">· ${esc(itemName(x.d.productId,x.d.modelId))}</span> ${x.live?"":'<span class="tag">no descuenta aún</span>'}</div>
    <div class="hint" style="margin:2px 0 6px">Pedido: ${nf(x.orderQ,0)} u. · Lote: ${nf(x.lotQ,0)} u. · repetidas ≈ <b>${nf(x.dup,0)} u.</b> (${money(x.dup*pr)})</div>
    <div class="actions" style="margin:0"><button class="btn small" data-act="supFixOrder" data-od="${x.d.id}" data-id="${sid}">Quitar del pedido</button><button class="btn small" data-act="supFixLot" data-ld="${x.ld.id}" data-id="${sid}">Quitar del lote</button></div></div>`).join("")}</div>`:'<p class="hint" style="margin:10px 0 0"><span class="tag g">Sin repetidos</span> Ningún pedido y lote vinculados cuentan este insumo dos veces.</p>';
  openModal(`<div class="panel-h"><h3>${esc(s.code)} · ${esc(s.name)}</h3><span class="muted">${money(pr)} por unidad</span></div>
   <div class="stats s4" style="grid-template-columns:repeat(4,1fr)"><div class="stat"><b>${u.lots.length}</b><span>lotes</span></div><div class="stat"><b>${u.ords.length}</b><span>pedidos</span></div><div class="stat"><b>${nf(u.out,0)} u.</b><span>descontadas del inventario</span></div><div class="stat"><b class="${u.dupQ?"neg":"pos"}">${nf(u.dupQ,0)} u.</b><span>contadas de más</span><small>${money(u.dupQ*pr)}</small></div></div>
   ${sec("Repeticiones",dupT)}${sec("En lotes",lotsT)}${sec("En pedidos",ordT)}
   ${u.fichas.length?sec("Fichas técnicas que lo llevan",`<p class="hint" style="margin:0">${u.fichas.map(f=>esc(prodName(f.productId)+(f.modelId?" · "+modelName(f.modelId):""))).join(", ")}. Si quitas el insumo de un lote, los lotes nuevos lo traerán otra vez desde su ficha: edítala en Diseño para corregirlo de raíz.</p>`):""}
   <div class="actions"><button class="btn ghost" data-act="mClose">Cerrar</button></div>`,true);
}

function quoteRes(){
  const q=S.quote,mg=nz(q.margin)/100,M=stockMap(),el=$("#q-res");if(!el)return;
  if(!q.items.length){el.innerHTML='<div class="panel-h"><h2>Resultado estimado</h2></div><p class="muted">Añade un producto para ver el estimado.</p>';return}
  let tc=0,tr=0;
  const rows=q.items.map(it=>{const qty=Math.max(0,nz(it.qty)),c=specCost(it.spec,qty),unit=qty?c.cost/qty:0,sug=unit*(1+mg),pr=it.price!==""&&num(it.price)!=null?num(it.price):sug,rev=pr*qty;tc+=c.cost;tr+=rev;
    /* cuántas unidades alcanza con el stock actual */
    let max=null;const need={},needS={};for(const a of it.spec){const pp=nz(a.perProd);if(!(pp>0))continue;for(const col of a.cols)if(col.materialId)need[col.materialId]=(need[col.materialId]||0)+nz(col.pesoU)*pp+nz(col.purga);for(const s of a.sups||[])if(s.supplyId)needS[s.supplyId]=(needS[s.supplyId]||0)+nz(s.qty)}
    for(const [k,g] of Object.entries(need))if(g>0){const n=Math.floor(Math.max(0,stockOf("Material",+k,M))/g);max=max==null?n:Math.min(max,n)}
    for(const [k,n0] of Object.entries(needS))if(n0>0){const n=Math.floor(Math.max(0,stockOf("Insumo",+k,M))/n0);max=max==null?n:Math.min(max,n)}
    return{it,qty,c,unit,sug,pr,rev,max}});
  el.innerHTML=`<div class="panel-h"><h2>Resultado estimado</h2></div>${rows.map(r=>`<div class="art"><div class="art-h"><h3>${esc(itemName(r.it.productId,r.it.modelId)||"Producto")} × ${r.qty}</h3></div>
   <div class="prev"><span>Peso <b>${nf(r.c.g,1)} g</b></span><span>Tiempo <b>${hm(r.c.min)}</b></span><span>Material <b>${money(r.c.costMat)}</b></span><span>Luz <b>${money(r.c.costElec)}</b></span><span>Insumos <b>${money(r.c.costSup)}</b></span></div>
   <table class="tbl" style="margin-top:8px"><tbody><tr><td>Costo por producto</td><td class="num"><b>${money(r.unit)}</b></td></tr><tr><td>Precio sugerido (+${nf(nz(q.margin),0)} %)</td><td class="num">${money(r.sug)}</td></tr><tr><td>Precio usado</td><td class="num"><b>${money(r.pr)}</b></td></tr><tr><td>Ganancia</td><td class="num"><b class="${r.rev-r.c.cost>=0?"pos":"neg"}">${money(r.rev-r.c.cost)}</b></td></tr>${r.max!=null?`<tr><td>Con el stock actual alcanzan</td><td class="num">${r.max} u. ${r.max<r.qty?'<span class="tag b">no alcanza</span>':""}</td></tr>`:""}</tbody></table>${r.c.unres>0?'<p class="hint warn">Hay filamento sin elegir: el costo está incompleto.</p>':""}</div>`).join("")}
   <table class="tbl"><tbody><tr><td><b>Costo total</b></td><td class="num"><b>${money(tc)}</b></td></tr><tr><td><b>Total a cobrar</b></td><td class="num"><b>${money(tr)}</b></td></tr><tr><td><b>Ganancia total</b></td><td class="num"><b class="${tr-tc>=0?"pos":"neg"}">${money(tr-tc)}</b> <span class="muted">${tr?nf((tr-tc)/tr*100,0):0} % del precio</span></td></tr></tbody></table>
   <div class="actions"><button class="btn primary" data-act="qToOrder">Pasar a pedido</button></div>`;
}

/* ================= ANÁLISIS ================= */
VIEWS.ana=()=>({prod:anaProd,real:anaReal,ventas:anaVentas,renta:anaRenta})[curSub("ana")]();
const stat=(b,s,sm,cls="")=>`<div class="stat"><b class="${cls}">${b}</b><span>${s}</span><small>${sm||""}</small></div>`;
function anaProd(){
  const L=allLots().filter(l=>consumes(l.lot)&&l.min>0&&l.g>0).map(l=>({...l,flow:l.g/l.min}));
  if(!L.length)return '<div class="panel"><p class="muted">Aún no hay lotes con tiempo y peso registrados.</p></div>';
  const G=L.reduce((a,l)=>a+l.g,0),T=L.reduce((a,l)=>a+l.min,0),mean=G/T,fl=L.map(l=>l.flow),avg=fl.reduce((a,v)=>a+v,0)/fl.length,sd=Math.sqrt(fl.reduce((a,v)=>a+(v-avg)**2,0)/fl.length),cv=avg?sd/avg*100:0;
  const waste=L.reduce((a,l)=>a+l.mats.reduce((s,m)=>s+m.waste,0),0);
  const verdict=cv<15?"Muy uniforme: casi todos los lotes consumen material al mismo ritmo.":cv<30?"Moderadamente uniforme.":"Muy variable entre lotes.";
  const trs=L.map(l=>{const d=(l.flow/mean-1)*100;return `<tr><td><b>${esc(l.lot.code)}</b></td><td>${esc(l.lot.description||"")}</td><td class="num">${hm(l.min)}</td><td class="num">${nf(l.g,1)} g</td><td class="num"><b>${nf(l.flow,3)}</b></td><td class="num ${d>=0?"pos":"neg"}">${d>=0?"+":""}${nf(d,0)} %</td><td>${Math.abs(d)<=25?'<span class="tag">normal</span>':d>0?'<span class="tag w">más material por minuto</span>':'<span class="tag a">menos material por minuto</span>'}</td></tr>`}).join("");
  const byEq={};for(const l of L)for(const e of l.eq)if(e.min>0){const k=eqName(e.id);(byEq[k]??={min:0,l:new Set()});byEq[k].min+=e.min;byEq[k].l.add(l.lot.id)}
  return `<div class="stats">${stat(nf(mean,3),"g/min promedio",`${nf(G,0)} g en ${nf(T/60,1)} h`)}${stat(nf(Math.min(...fl),3)+"–"+nf(Math.max(...fl),3),"rango g/min","")}${stat(nf(cv,1)+" %","variación (CV)","menor = más parejo")}${stat(nf(waste,0)+" g","desperdicio registrado",nf(waste/G*100,1)+" % del material")}${stat(L.length,"lotes analizados","")}${stat(nf(L.reduce((a,l)=>a+l.fail,0),0),"piezas falladas","")}</div>
   <div class="panel"><div class="panel-h"><h2>¿Todos los lotes tienen la misma relación?</h2></div><p style="margin:0 0 6px"><b>${verdict}</b></p><p class="hint" style="margin:0">Flujo = material usado ÷ minutos. Se marcan los lotes a más de 25 % del promedio.</p></div>
   <div class="panel"><div class="panel-h"><h2>Flujo por lote (g/min)</h2></div>${lineChart(L.map(l=>l.lot.code),[{color:"var(--accent)",values:fl,w:3},{color:"#BF7400",values:fl.map(()=>mean),w:2}],{fmt:v=>nf(v,2),tipFn:i=>`<b>${esc(L[i].lot.code)}</b><br>${nf(L[i].flow,3)} g/min`})}</div>
   <div class="panel"><div class="panel-h"><h2>Detalle por lote</h2></div><div class="scroll"><table class="tbl"><thead><tr><th>Lote</th><th>Descripción</th><th class="num">Tiempo</th><th class="num">Material</th><th class="num">g/min</th><th class="num">vs. promedio</th><th></th></tr></thead><tbody>${trs}</tbody></table></div></div>
   <div class="panel"><div class="panel-h"><h2>Por equipo</h2></div>${table([{h:"Equipo",f:r=>`<b>${esc(r[0])}</b>`},{h:"Lotes",num:1,f:r=>r[1].l.size},{h:"Tiempo",num:1,f:r=>hm(r[1].min)}],Object.entries(byEq))}</div>`;
}
function anaReal(){
  const L=allLots().filter(l=>consumes(l.lot));if(!L.length)return '<div class="panel"><p class="muted">Aún no hay lotes que comparar.</p></div>';
  const p=(e,r)=>e>0?`<span class="${r>e*1.05?"neg":r<e*.95?"pos":""}">${r>=e?"+":""}${nf((r/e-1)*100,0)} %</span>`:'<span class="muted">sin est.</span>';
  const rows=L.map(l=>({l}));
  const MT={};for(const l of L)for(const m of l.mats){const a=MT[m.id]??={est:0,real:0,waste:0};a.est+=m.est;a.real+=m.real;a.waste+=m.waste}
  const G=L.reduce((a,l)=>a+l.g,0),GE=L.reduce((a,l)=>a+l.gEst,0),C=L.reduce((a,l)=>a+l.cost,0),CE=L.reduce((a,l)=>a+l.costEst,0);
  return `<div class="stats s4">${stat(nf(G,0)+" g","filamento real",`estimado ${nf(GE,0)} g`)}${stat(GE?p(GE,G):"—","diferencia de material","")}${stat(money(C),"costo real",`estimado ${money(CE)}`)}${stat(CE?p(CE,C):"—","diferencia de costo","")}</div>
   <div class="panel"><div class="panel-h"><h2>Estimado vs. real por lote</h2><span class="muted">Rojo = se gastó más de lo que decía la ficha técnica</span></div>${table([{h:"Lote",f:r=>`<b>${esc(r.l.lot.code)}</b>`},{h:"Descripción",f:r=>esc(r.l.lot.description||"")},{h:"Material est.",num:1,f:r=>nf(r.l.gEst,1)+" g"},{h:"Material real",num:1,f:r=>nf(r.l.g,1)+" g"},{h:"Dif.",num:1,f:r=>p(r.l.gEst,r.l.g)},{h:"Tiempo est.",num:1,f:r=>hm(r.l.est.min)},{h:"Tiempo real",num:1,f:r=>hm(r.l.min)},{h:"Costo est.",num:1,f:r=>money(r.l.costEst)},{h:"Costo real",num:1,f:r=>money(r.l.cost)},{h:"Dif.",num:1,f:r=>p(r.l.costEst,r.l.cost)}],rows)}</div>
   <div class="panel"><div class="panel-h"><h2>Por material</h2></div>${table([{h:"Material",f:r=>esc(matLabel(+r[0]))},{h:"Estimado",num:1,f:r=>nf(r[1].est,0)+" g"},{h:"Real",num:1,f:r=>nf(r[1].real,0)+" g"},{h:"Diferencia",num:1,f:r=>p(r[1].est,r[1].real)},{h:"Desperdicio",num:1,f:r=>nf(r[1].waste,0)+" g"}],Object.entries(MT))}</div>`;
}
function anaVentas(){
  const OC=D.orders.filter(o=>!o.cancelled).map(o=>orderCalc(o));if(!OC.length)return '<div class="panel"><p class="muted">Aún no hay pedidos.</p></div>';
  const tot=OC.reduce((a,c)=>a+c.total,0),paid=OC.filter(c=>c.o.paid).reduce((a,c)=>a+c.total,0),units=OC.reduce((a,c)=>a+c.qty,0),cl=new Set(OC.map(c=>c.o.clientId)).size;
  const M={};OC.forEach(c=>{const k=(c.o.date||"").slice(0,7);if(k)M[k]=(M[k]||0)+c.total});const ks=Object.keys(M).sort();
  const P={};OC.forEach(c=>c.ds.forEach(d=>{const k=prodName(d.productId),a=P[k]??={n:0,u:0,v:0};a.n++;a.u+=nz(d.qty);a.v+=unitPrice(d)*nz(d.qty)}));
  const C={};OC.forEach(c=>{const a=C[c.o.clientId]??={n:0,v:0};a.n++;a.v+=c.total});
  return `<div class="stats">${stat(money(tot),"ventas totales",`${OC.length} pedidos · ${units} unidades`)}${stat(money(paid),"cobrado",`${tot?Math.round(paid/tot*100):0} % del total`,"pos")}${stat(money(tot-paid),"por cobrar","",tot-paid?"neg":"")}${stat(money(tot/OC.length),"ticket promedio","")}${stat(cl,"clientes",nf(OC.length/cl,1)+" pedidos c/u")}${stat(OC.filter(c=>!c.total).length,"sin precio","")}</div>
   <div class="grid g2e"><div class="panel"><div class="panel-h"><h2>Ventas por mes</h2></div>${ks.length?barChart(ks.map(k=>new Date(k+"-15T12:00:00").toLocaleDateString("es",{month:"short",year:"2-digit"})),ks.map(k=>M[k]),{fmt:v=>"$"+nf(v,0),tipFn:i=>`<b>${ks[i]}</b><br>${money(M[ks[i]])}`}):'<p class="muted">Sin fechas.</p>'}</div>
   <div class="panel"><div class="panel-h"><h2>Mejores clientes</h2></div>${table([{h:"Cliente",f:r=>`<b>${esc(cliName(+r[0]))}</b>`},{h:"Pedidos",num:1,f:r=>r[1].n},{h:"Comprado",num:1,f:r=>money(r[1].v)}],Object.entries(C).sort((a,b)=>b[1].v-a[1].v).slice(0,10))}</div></div>
   <div class="panel"><div class="panel-h"><h2>Ventas por producto</h2></div>${table([{h:"Producto",f:r=>`<b>${esc(r[0])}</b>`},{h:"Pedidos",num:1,f:r=>r[1].n},{h:"Unidades",num:1,f:r=>r[1].u},{h:"Ventas",num:1,f:r=>money(r[1].v)},{h:"%",num:1,f:r=>nf(tot?r[1].v/tot*100:0,0)+" %"}],Object.entries(P).sort((a,b)=>b[1].v-a[1].v))}</div>`;
}
function anaRenta(){
  const OC=D.orders.filter(o=>!o.cancelled).map(o=>orderCalc(o)).filter(c=>c.hasLot&&c.total>0);
  if(!OC.length)return '<div class="panel"><p class="muted">Aquí verás cuánto costó producir cada pedido y cuánto ganaste. Empieza asignando un pedido a un lote («Crear lote» en Pedidos).</p></div>';
  const rev=OC.reduce((a,c)=>a+c.total,0),cost=OC.reduce((a,c)=>a+c.cost,0),gain=rev-cost;
  let min=0;for(const c of OC)for(const d of c.ds)for(const a of D.allocations.filter(a=>a.orderDetailId===d.id)){const ld=by("lotDetails",a.lotDetailId),lot=ld&&by("lots",ld.lotId);if(!lot)continue;const lc_=lotCalc(lot),x=lc_.dd.find(y=>y.d.id===ld.id);if(x)min+=lc_.min*x.share*(nz(a.qty)/Math.max(1,nz(ld.qty)))}
  const P={};OC.forEach(c=>c.ds.forEach(d=>{const k=prodName(d.productId),a=P[k]??={n:0,u:0,rev:0};a.n++;a.u+=nz(d.qty);a.rev+=unitPrice(d)*nz(d.qty)}));
  const share={};OC.forEach(c=>{const tq=c.ds.reduce((s,d)=>s+nz(d.qty)*unitPrice(d),0)||1;c.ds.forEach(d=>{const k=prodName(d.productId);share[k]=(share[k]||0)+c.cost*(unitPrice(d)*nz(d.qty)/tq)})});
  return `<div class="stats">${stat(OC.length,"pedidos con lote","")}${stat(money(rev),"ingresos","")}${stat(money(cost),"costo real de producción","")}${stat(money(gain),"ganancia",`${rev?nf(gain/rev*100,0):0} % de margen`,gain>=0?"pos":"neg")}${stat(nf(min/60,1)+" h","horas máquina","asignadas a pedidos")}${stat(min?money(gain/(min/60)):"—","ganancia por hora","")}</div>
   <div class="panel"><div class="panel-h"><h2>Por producto</h2></div>${table([{h:"Producto",f:r=>`<b>${esc(r[0])}</b>`},{h:"Pedidos",num:1,f:r=>r[1].n},{h:"Unid.",num:1,f:r=>r[1].u},{h:"Ingresos",num:1,f:r=>money(r[1].rev)},{h:"Costo",num:1,f:r=>money(share[r[0]]||0)},{h:"Ganancia",num:1,f:r=>`<span class="${r[1].rev-(share[r[0]]||0)>=0?"pos":"neg"}">${money(r[1].rev-(share[r[0]]||0))}</span>`}],Object.entries(P))}</div>
   <div class="panel"><div class="panel-h"><h2>Por pedido</h2><span class="muted">El costo del lote se reparte entre sus pedidos según las unidades asignadas</span></div>${table([{h:"Pedido",f:r=>`<span class="cod">${esc(r.o.code)}</span>`},{h:"Cliente",f:r=>esc(cliName(r.o.clientId))},{h:"Precio",num:1,f:r=>money(r.total)},{h:"Costo",num:1,f:r=>money(r.cost)},{h:"Ganancia",num:1,f:r=>`<span class="${r.gain>=0?"pos":"neg"}">${money(r.gain)}${r.costed?"":"*"}</span>`},{h:"Margen",num:1,f:r=>nf(r.gain/r.total*100,0)+" %"}],OC.reverse())}<p class="hint" style="margin:8px 0 0">* parcial: faltan unidades por asignar a un lote.</p></div>`;
}

/* ================= respaldo en Excel + arranque =================
   Los datos viven en IndexedDB (se guardan solos). El Excel es un respaldo/portabilidad: una hoja por tabla. */
const XT="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet",JP="§json:";
const xesc=s=>String(s).replace(/[\x00-\x08\x0b\x0c\x0e-\x1f]/g,"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const xcol=i=>{let s="";i++;while(i>0){const m=(i-1)%26;s=String.fromCharCode(65+m)+s;i=(i-m-1)/26}return s};
const xcolIdx=r=>{let n=0;for(const c of r.replace(/[0-9]/g,""))n=n*26+c.charCodeAt(0)-64;return n-1};
async function buildXlsx(){
  const z=new JSZip(),ids=STORES,H='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>';
  z.file("[Content_Types].xml",H+'<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>'+ids.map((k,i)=>`<Override PartName="/xl/worksheets/sheet${i+1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join("")+"</Types>");
  z.file("_rels/.rels",H+'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>');
  z.file("xl/workbook.xml",H+'<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>'+ids.map((k,i)=>`<sheet name="${k}" sheetId="${i+1}" r:id="rId${i+1}"/>`).join("")+"</sheets></workbook>");
  z.file("xl/_rels/workbook.xml.rels",H+'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+ids.map((k,i)=>`<Relationship Id="rId${i+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i+1}.xml"/>`).join("")+`<Relationship Id="rId${ids.length+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`);
  z.file("xl/styles.xml",H+'<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font></fonts><fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="2"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"/></cellXfs></styleSheet>');
  const cell=(v,ci,ri,st)=>{if(v===undefined||v===null||v==="")return"";const ref=xcol(ci)+ri;
    if(typeof v==="number"&&isFinite(v))return `<c r="${ref}"${st?' s="1"':""}><v>${v}</v></c>`;
    const s=(typeof v==="object"||typeof v==="boolean")?JP+JSON.stringify(v):String(v);
    return `<c r="${ref}" t="inlineStr"${st?' s="1"':""}><is><t xml:space="preserve">${xesc(s)}</t></is></c>`};
  ids.forEach((k,i)=>{
    const rows=D[k],keys=["id"];rows.forEach(r=>Object.keys(r).forEach(c=>{if(!keys.includes(c))keys.push(c)}));
    let xml=H+'<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews><cols><col min="1" max="'+keys.length+'" width="20" customWidth="1"/></cols><sheetData>';
    xml+='<row r="1">'+keys.map((c,ci)=>cell(c,ci,1,1)).join("")+"</row>";
    rows.forEach((r,ri)=>{xml+=`<row r="${ri+2}">`+keys.map((c,ci)=>cell(r[c],ci,ri+2)).join("")+"</row>"});
    z.file(`xl/worksheets/sheet${i+1}.xml`,xml+"</sheetData></worksheet>");
  });
  return z.generateAsync({type:"blob",mimeType:XT,compression:"DEFLATE"});
}
async function parseXlsx(file){
  const z=await JSZip.loadAsync(await file.arrayBuffer()),dp=new DOMParser(),xml=async p=>{const f=z.file(p);return f?dp.parseFromString(await f.async("string"),"application/xml"):null};
  const ss=[],sd=await xml("xl/sharedStrings.xml");
  if(sd)for(const si of sd.getElementsByTagName("si"))ss.push([...si.getElementsByTagName("t")].filter(t=>t.parentNode.nodeName!=="rPh").map(t=>t.textContent).join(""));
  const wb=await xml("xl/workbook.xml"),rel=await xml("xl/_rels/workbook.xml.rels"),map={};
  for(const r of rel.getElementsByTagName("Relationship"))map[r.getAttribute("Id")]=r.getAttribute("Target").replace(/^\/?(xl\/)?/,"");
  const out={},rev={};STORES.forEach(k=>rev[k.toLowerCase()]=k);
  for(const s of wb.getElementsByTagName("sheet")){
    const key=rev[s.getAttribute("name").trim().toLowerCase()];if(!key)continue;
    const rid=s.getAttributeNS("http://schemas.openxmlformats.org/officeDocument/2006/relationships","id")||s.getAttribute("r:id");
    const sh=await xml("xl/"+map[rid]);if(!sh)continue;const grid=[];
    for(const row of sh.getElementsByTagName("row")){const arr=[];
      for(const c of row.getElementsByTagName("c")){const t=c.getAttribute("t"),v=c.getElementsByTagName("v")[0];let val;
        if(t==="inlineStr")val=[...c.getElementsByTagName("t")].map(x=>x.textContent).join("");
        else if(!v)continue;else if(t==="s")val=ss[+v.textContent];else if(t==="str"||t==="e")val=v.textContent;else if(t==="b")val=v.textContent==="1";else val=Number(v.textContent);
        arr[xcolIdx(c.getAttribute("r"))]=val}
      grid.push(arr)}
    if(!grid.length)continue;
    const head=(grid[0]||[]).map(h=>h==null?"":String(h).trim()),recs=[];
    for(const arr of grid.slice(1)){const o={};
      head.forEach((h,i)=>{let v=arr[i];if(!h||v===undefined||v==="")return;
        if(typeof v==="string"&&v.startsWith(JP)){try{v=JSON.parse(v.slice(JP.length))}catch(e){}}
        else if(typeof v==="number"&&/(^date$|Date$|^fecha$)/.test(h)&&v>20000&&v<80000)v=new Date(Math.round((v-25569)*864e5)).toISOString().slice(0,10);
        o[h]=v});
      if(o.id!==undefined)o.id=Number(o.id);
      if(Object.keys(o).filter(x=>x!=="id").length)recs.push(o)}
    out[key]=recs}
  return out;
}
function download(blob,name){const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}
const hdb=()=>new Promise((r,j)=>{const q=indexedDB.open("enigma_prefs",1);q.onupgradeneeded=()=>q.result.createObjectStore("kv");q.onsuccess=()=>r(q.result);q.onerror=()=>j(q.error)});
async function hget(){try{const d=await hdb();return await new Promise(r=>{const q=d.transaction("kv").objectStore("kv").get("handle");q.onsuccess=()=>r(q.result||null);q.onerror=()=>r(null)})}catch(e){return null}}
async function hset(h){try{const d=await hdb();await new Promise(r=>{const t=d.transaction("kv","readwrite");t.objectStore("kv").put(h,"handle");t.oncomplete=r;t.onerror=r})}catch(e){}}
async function saveFile(){
  const blob=await buildXlsx();
  if(!window.showSaveFilePicker){download(blob,"ENIGMA_ERP.xlsx");S.dirty=false;renderBar();toast("Este navegador no puede sobrescribir: se descargó una copia");return}
  try{let h=await hget();
    if(h&&(await h.queryPermission({mode:"readwrite"}))!=="granted"&&(await h.requestPermission({mode:"readwrite"}))!=="granted")h=null;
    if(!h){h=await showSaveFilePicker({suggestedName:"ENIGMA_ERP.xlsx",types:[{description:"Excel",accept:{[XT]:[".xlsx"]}}]});await hset(h)}
    const w=await h.createWritable();await w.write(blob);await w.close();S.dirty=false;S.fileName=h.name;renderBar();toast("Guardado en "+h.name);
  }catch(e){if(e.name==="AbortError")return;console.error(e);
    if(e.name==="SecurityError"){download(blob,"ENIGMA_ERP.xlsx");toast("Esta ventana no permite escribir en tu carpeta: se descargó una copia. Abre el archivo directamente en Chrome o Edge.",6000);return}
    await hset(null);S.fileName="";renderBar();toast("No se pudo guardar. Pulsa Guardar otra vez y elige el archivo de tu carpeta.",5000)}
}
async function importData(file){
  try{const d=await parseXlsx(file),ks=Object.keys(d);
    if(!ks.length){toast("El archivo no tiene hojas de ENIGMA ERP. Usa un Excel exportado desde ENIGMA.");return}
    const n=ks.reduce((a,k)=>a+d[k].length,0);
    if(!confirm(`Se encontraron ${n} registros en ${ks.length} hojas.\n\nSe REEMPLAZARÁN los datos actuales de esas hojas. Si dudas, cancela y usa primero «Exportar» para respaldar.\n\n¿Continuar?`))return;
    for(const k of ks){clearStore(k);for(const r of d[k])put(k,r)}
    await wq;S.dirty=false;S.draft=null;S.fd=null;S.cl=null;S.pr=null;renderAll();toast("Datos importados: "+n+" registros");
  }catch(e){console.error(e);toast("No se pudo leer el archivo. ¿Es un .xlsx válido?")}
}
ACT.fileExport=async()=>{download(await buildXlsx(),"ENIGMA_ERP_"+todayISO()+".xlsx");S.dirty=false;renderBar();toast("Excel descargado")};
ACT.fileSave=saveFile;
ACT.fileImport=()=>$("#fileIn").click();
ACT.fileOld=()=>$("#fileOld").click();
ACT.fileLink=async()=>{
  if(!window.showOpenFilePicker)return toast("Este navegador no permite vincular archivos. Usa Chrome o Edge.");
  try{const[h]=await showOpenFilePicker({types:[{description:"Excel",accept:{[XT]:[".xlsx"]}}]});
    if((await h.requestPermission({mode:"readwrite"}))!=="granted")return toast("Hace falta permiso para escribir en ese archivo.");
    await hset(h);S.fileName=h.name;renderBar();
    const f=await h.getFile();
    if(f.size>0&&confirm(`Archivo vinculado: ${h.name}\n\n¿Cargar ahora los datos que contiene?\nAceptar = cargarlos (reemplaza los actuales)\nCancelar = dejar los datos actuales; al guardar se sobrescribirá ese archivo.`))await importData(f);
    else toast("Vinculado a "+h.name+". Al guardar se escribirá ahí.");
  }catch(e){if(e.name==="AbortError")return;console.error(e);toast("No se pudo vincular el archivo. Abre ENIGMA directamente en Chrome o Edge.")}
};
ACT.menu=()=>{S.menu=!S.menu;renderBar()};
for(const k of ["fileSave","fileExport","fileImport","fileOld","fileLink"]){const f=ACT[k];ACT[k]=(...a)=>{S.menu=false;renderBar();return f(...a)}}
document.addEventListener("click",e=>{if(S.menu&&!e.target.closest(".menu-wrap")){S.menu=false;renderBar()}});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&S.menu){S.menu=false;renderBar()}
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="s"){e.preventDefault();ACT.fileSave()}});
$("#fileIn").onchange=e=>{const f=e.target.files[0];e.target.value="";if(f)importData(f)};
$("#fileOld").onchange=e=>{const f=e.target.files[0];e.target.value="";if(f)(window.importOld?importOld(f):toast("La importación desde index aún no está lista."))};
async function boot(){
  DB=await dbOpen();await dbLoad();
  if(!D.settings.length)cfg();
  D.materials.filter(m=>!m.classification&&matClass(m)).forEach(m=>put("materials",{...m,classification:matClass(m)}));
  {const cs=classes(),miss=[];for(const m of D.materials){const c=matClass(m);if(c&&!cs.some(x=>x.code===c)&&!miss.some(x=>x.code===c))miss.push({code:c,line:m.line||m.kind||""})}if(miss.length){const c=cfg();c.classes=[...cs,...miss];put("settings",c)}}
  {const c=cfg();if(!c.modelNumbering){for(const pr of D.products)D.models.filter(m=>m.productId===pr.id).sort((a,b)=>a.id-b.id).forEach((m,i)=>{const code="M"+(i+1);if(m.code!==code)put("models",{...m,code})});c.modelNumbering=true;put("settings",c)}}
  await wq;S.dirty=false;renderAll();
  hget().then(h=>{if(h){S.fileName=h.name;renderBar()}});
}
boot().catch(e=>{console.error(e);$("#view").innerHTML='<div class="panel"><h2>No se pudo iniciar la base local</h2><p class="muted">Abre este archivo en un navegador moderno con IndexedDB habilitado.</p></div>'});

</script>
