<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ENIGMA">
<title>ENIGMA</title>
<style>
:root{--bg:#E5E1D5;--bar:#FAF8F3;--ink:#191512;--mute:#625C52;--line:#CBC5B4;--bh:46px}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#14110e;--bar:#1e1a16;--ink:#EDE8DA;--mute:#a39b8b;--line:#3a342c}}
:root[data-theme=dark]{--bg:#14110e;--bar:#1e1a16;--ink:#EDE8DA;--mute:#a39b8b;--line:#3a342c}
*{box-sizing:border-box}html,body{height:100%;margin:0;background:var(--bg)}
body{display:flex;flex-direction:column;font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;color:var(--ink)}
nav{display:flex;align-items:center;gap:14px;height:calc(var(--bh) + env(safe-area-inset-top,0px));padding:env(safe-area-inset-top,0px) 14px 0;background:var(--bar);border-bottom:1px solid var(--line);flex:none}
.brand{font-weight:800;letter-spacing:.14em;font-size:13px}
.tabs{display:flex;gap:4px;padding:3px;border:1px solid var(--line);border-radius:999px}
.tabs button{font:inherit;font-size:13px;font-weight:600;border:0;background:none;color:var(--mute);padding:6px 18px;border-radius:999px;cursor:pointer}
.tabs button[aria-selected=true]{background:var(--ink);color:var(--bar)}
main{flex:1;min-height:0;position:relative}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg)}
iframe[hidden]{display:none}
@media(max-width:640px){
 body{flex-direction:column-reverse}
 nav{height:calc(var(--bh) + env(safe-area-inset-bottom,0px));padding:0 10px env(safe-area-inset-bottom,0px);justify-content:center;border-bottom:0;border-top:1px solid var(--line)}
 .brand{display:none}.tabs{width:100%}.tabs button{flex:1}
}
</style>
</head>
<body>
<nav>
  <span class="brand">ENIGMA</span>
  <div class="tabs" role="tablist">
    <button role="tab" id="t-center" aria-selected="false">Center</button>
    <button role="tab" id="t-ventas" aria-selected="false">Ventas</button>
  </div>
</nav>
<main>
  <iframe id="f-center" title="Enigma Studio Center" data-src="center.html" hidden></iframe>
  <iframe id="f-ventas" title="Enigma Ventas" data-src="ventas.html" hidden></iframe>
</main>
<script>
"use strict";
const TABS=["center","ventas"],KEY="enigma_hub_tab",$=id=>document.getElementById(id);
const get=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
function show(tab,push){
  if(!TABS.includes(tab)) tab="center";
  for(const t of TABS){
    const f=$("f-"+t),on=t===tab;
    if(on&&!f.getAttribute("src")) f.src=f.dataset.src;   /* se carga la primera vez que entras */
    f.hidden=!on; $("t-"+t).setAttribute("aria-selected",on);
  }
  document.title=tab==="ventas"?"ENIGMA · Ventas":"ENIGMA · Center";
  try{localStorage.setItem(KEY,tab)}catch(e){}
  if(push!==false) history.replaceState(null,"","#"+tab);
}
TABS.forEach(t=>$("t-"+t).onclick=()=>show(t));
addEventListener("hashchange",()=>show(location.hash.slice(1),false));
/* el tema que elijas dentro de una sección también se refleja en la barra */
const theme=()=>{const v=get("enigma_theme"); if(v==="light"||v==="dark") document.documentElement.setAttribute("data-theme",v);};
theme(); addEventListener("storage",e=>{if(e.key==="enigma_theme")theme()});
show(location.hash.slice(1)||get(KEY)||"center",false);
</script>
</body>
</html>
